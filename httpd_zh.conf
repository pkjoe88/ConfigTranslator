## 這是 Apache HTTP 伺服器的主設定檔。# 裡面包含了各種控制伺服器運作的設定指令。# 詳細資訊可以參考# <URL:http://httpd.apache.org/docs/2.4/>。# 尤其是 <URL:http://httpd.apache.org/docs/2.4/mod/directives.html> 這頁，# 裡面有各個設定指令的詳細說明。## 看完裡面的說明後，一定要搞懂意思再動手改，不要隨便照著做。# 這裡寫的都只是提示跟提醒而已。如果不確定怎麼設，就去查線上文件。# 特此提醒，請自己注意。## 設定檔與日誌檔的名子：# 如果您在指定很多伺服器控制檔案的檔名時，開頭是用 "/"（Win32 系統則是 "磁碟機代號:/"），# 伺服器就會直接用這個絕對路徑。# 如果檔名開頭 *不是* "/"，伺服器就會自動把 ServerRoot 的值加在最前面。# 舉例來說，當 ServerRoot 設為 "/usr/local/apache2" 時，# "logs/access_log" 就會被伺服器當成 "/usr/local/apache2/logs/access_log"；# 但如果是 "/logs/access_log"，就會直接被當成 '/logs/access_log'。## 注意：只要有用到檔案路徑，一律要用正斜線，# 不能用反斜線（例如要寫 "c:/apache"，不要寫 "c:\apache"）。# 如果沒寫磁碟機代號，系統預設會直接用 httpd.exe 所在的那個磁碟機。# 建議您在寫絕對路徑時，最好都把磁碟機代號明確寫出來，比較不會搞混。## ServerRoot：這是伺服器目錄樹的最頂層，用來存放設定檔、錯誤記錄檔和日誌檔。## 目錄路徑的最後面不要加斜線。# 如果您把 ServerRoot 指向非本機的磁碟機，而且有用到檔案型態的 mutex，# 請記得一定要在 Mutex 指令裡指定一個本機磁碟機。# 如果您想讓多個 httpd 背景程式共用同一個 ServerRoot，至少要把 PidFile 改掉。#Define SRVROOT "D:/Robot_Program/Apache24"ServerRoot "${SRVROOT}"## Mutex：讓您可以針對個別的 mutex 設定其機制與存放目錄，# 或是直接修改全域的預設值。## 如果您的 mutex 是檔案型態，而且預設的存放目錄不在本機磁碟機上，# 或是因為其他原因不合適，請把這行的註解拿掉並修改目錄路徑。## Mutex default:logs## Listen：讓您把 Apache 綁定在特定的 IP 位址或 port，而不是用預設值。# 也可以參考 <VirtualHost> 指令。## 您可以把它改掉，像下面這樣設定聽特定的 IP 位址，# 這樣可以防止 Apache 一口氣抓走所有綁定的 IP。## Listen 12.34.56.78:80Listen 80## Dynamic Shared Object (DSO) 支援## 如果您要用到編譯成 DSO 的模組功能，就要把對應的 `LoadModule' 寫在這裡。# 這樣系統才會在用到那些設定指令之前，先把模組載進來。# 至於那些已經靜態編譯進去的模組（用 `httpd -l' 查得到的那些），# 就不用在這裡重複載入了。## 範例：LoadModule foo_module modules/mod_foo.so## LoadModule access_compat_module modules/mod_access_compat.soLoadModule actions_module modules/mod_actions.soLoadModule alias_module modules/mod_alias.soLoadModule allowmethods_module modules/mod_allowmethods.soLoadModule asis_module modules/mod_asis.soLoadModule auth_basic_module modules/mod_auth_basic.so#LoadModule auth_digest_module modules/mod_auth_digest.so#LoadModule auth_form_module modules/mod_auth_form.so#LoadModule authn_anon_module modules/mod_authn_anon.soLoadModule authn_core_module modules/mod_authn_core.so#LoadModule authn_dbd_module modules/mod_authn_dbd.so#LoadModule authn_dbm_module modules/mod_authn_dbm.soLoadModule authn_file_module modules/mod_authn_file.so#LoadModule authn_socache_module modules/mod_authn_socache.so#LoadModule authnz_fcgi_module modules/mod_authnz_fcgi.so#LoadModule authnz_ldap_module modules/mod_authnz_ldap.soLoadModule authz_core_module modules/mod_authz_core.so#LoadModule authz_dbd_module modules/mod_authz_dbd.so#LoadModule authz_dbm_module modules/mod_authz_dbm.soLoadModule authz_groupfile_module modules/mod_authz_groupfile.soLoadModule authz_host_module modules/mod_authz_host.so#LoadModule authz_owner_module modules/mod_authz_owner.soLoadModule authz_user_module modules/mod_authz_user.soLoadModule autoindex_module modules/mod_autoindex.so#LoadModule brotli_module modules/mod_brotli.so#LoadModule buffer_module modules/mod_buffer.so#LoadModule cache_module modules/mod_cache.so#LoadModule cache_disk_module modules/mod_cache_disk.so#LoadModule cache_socache_module modules/mod_cache_socache.so#LoadModule cern_meta_module modules/mod_cern_meta.soLoadModule cgi_module modules/mod_cgi.so#LoadModule charset_lite_module modules/mod_charset_lite.so#LoadModule data_module modules/mod_data.so#LoadModule dav_module modules/mod_dav.so# LoadModule dav_fs_module modules/mod_dav_fs.so#LoadModule dav_lock_module modules/mod_dav_lock.so#LoadModule dbd_module modules/mod_dbd.soLoadModule deflate_module modules/mod_deflate.soLoadModule dir_module modules/mod_dir.so#LoadModule dumpio_module modules/mod_dumpio.soLoadModule env_module modules/mod_env.so#LoadModule expires_module modules/mod_expires.so#LoadModule ext_filter_module modules/mod_ext_filter.so#LoadModule file_cache_module modules/mod_file_cache.so#LoadModule filter_module modules/mod_filter.so#LoadModule http2_module modules/mod_http2.so#LoadModule headers_module modules/mod_headers.so#LoadModule heartbeat_module modules/mod_heartbeat.so#LoadModule heartmonitor_module modules/mod_heartmonitor.so#LoadModule ident_module modules/mod_ident.so#LoadModule imagemap_module modules/mod_imagemap.soLoadModule include_module modules/mod_include.so#LoadModule info_module modules/mod_info.soLoadModule isapi_module modules/mod_isapi.so#LoadModule lbmethod_bybusyness_module modules/mod_lbmethod_bybusyness.so#LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so#LoadModule lbmethod_bytraffic_module modules/mod_lbmethod_bytraffic.so#LoadModule lbmethod_heartbeat_module modules/mod_lbmethod_heartbeat.so#LoadModule ldap_module modules/mod_ldap.so#LoadModule logio_module modules/mod_logio.soLoadModule log_config_module modules/mod_log_config.so#LoadModule log_debug_module modules/mod_log_debug.so#LoadModule log_forensic_module modules/mod_log_forensic.so#LoadModule lua_module modules/mod_lua.so#LoadModule macro_module modules/mod_macro.so#LoadModule md_module modules/mod_md.soLoadModule mime_module modules/mod_mime.so#LoadModule mime_magic_module modules/mod_mime_magic.soLoadModule negotiation_module modules/mod_negotiation.so#LoadModule proxy_module modules/mod_proxy.so#LoadModule proxy_ajp_module modules/mod_proxy_ajp.so#LoadModule proxy_balancer_module modules/mod_proxy_balancer.so#LoadModule proxy_connect_module modules/mod_proxy_connect.so#LoadModule proxy_express_module modules/mod_proxy_express.so#LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so#LoadModule proxy_ftp_module modules/mod_proxy_ftp.so#LoadModule proxy_hcheck_module modules/mod_proxy_hcheck.so#LoadModule proxy_html_module modules/mod_proxy_html.so#LoadModule proxy_http_module modules/mod_proxy_http.so#LoadModule proxy_http2_module modules/mod_proxy_http2.so#LoadModule proxy_scgi_module modules/mod_proxy_scgi.so#LoadModule proxy_uwsgi_module modules/mod_proxy_uwsgi.so#LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so#LoadModule ratelimit_module modules/mod_ratelimit.so#LoadModule reflector_module modules/mod_reflector.so#LoadModule remoteip_module modules/mod_remoteip.so#LoadModule request_module modules/mod_request.so#LoadModule reqtimeout_module modules/mod_reqtimeout.so#LoadModule rewrite_module modules/mod_rewrite.so#LoadModule sed_module modules/mod_sed.so#LoadModule session_module modules/mod_session.so#LoadModule session_cookie_module modules/mod_session_cookie.so#LoadModule session_crypto_module modules/mod_session_crypto.so#LoadModule session_dbd_module modules/mod_session_dbd.soLoadModule setenvif_module modules/mod_setenvif.so#LoadModule slotmem_plain_module modules/mod_slotmem_plain.so#LoadModule slotmem_shm_module modules/mod_slotmem_shm.so#LoadModule socache_dbm_module modules/mod_socache_dbm.so#LoadModule socache_memcache_module modules/mod_socache_memcache.so#LoadModule socache_redis_module modules/mod_socache_redis.so#LoadModule socache_shmcb_module modules/mod_socache_shmcb.so#LoadModule speling_module modules/mod_speling.soLoadModule ssl_module modules/mod_ssl.so#LoadModule status_module modules/mod_status.so#LoadModule substitute_module modules/mod_substitute.so#LoadModule unique_id_module modules/mod_unique_id.so#LoadModule userdir_module modules/mod_userdir.so#LoadModule usertrack_module modules/mod_usertrack.so#LoadModule version_module modules/mod_version.so#LoadModule vhost_alias_module modules/mod_vhost_alias.so#LoadModule watchdog_module modules/mod_watchdog.so#LoadModule xml2enc_module modules/mod_xml2enc.so# 新增 php7 的支援 & curl 模組#LoadFile "D:/Robot_Program/php7/libssh2.dll"#LoadModule php7_module "D:/Robot_Program/php7/php7apache2_4.dll"#PHPIniDir "D:/Robot_Program/php7"# 新增 php8 的支援。LoadFile "D:/Robot_Program/php82/libssh2.dll"LoadModule php_module "D:/Robot_Program/php82/php8apache2_4.dll"PHPIniDir "D:/Robot_Program/php82"<IfModule unixd_module>## 如果您想讓 httpd 用別的使用者或群組身分執行，# 一開始必須先用 root 權限啟動 httpd，之後它才會自動切換過去。## User/Group：這是指定要用哪個使用者或群組的身分來跑 httpd（可以填名稱或 #ID）。# 跟大部分的系統服務一樣，通常建議單獨幫 httpd 建立專用的使用者和群組會比較安全。#User daemonGroup daemon</IfModule># 主要伺服器的設定區塊## 這區的設定檔語法，是用來設定主要伺服器運作時的參數。# 當外部請求未被任何 <VirtualHost> 定義所處理時，將由該「主」伺服器回應。# 此外這些參數也為您在設定檔後續部分可能定義的各個 <VirtualHost> 容器提供了預設值。## 這裡看到的所有語法，也都可以放進 <VirtualHost> 區塊裡面。# 如果放進去的話，該虛擬主機就會用裡面的設定值，蓋掉這裡原本預設的設定。### ServerAdmin：您的聯絡信箱，伺服器出問題時會寄到這裡。# 當伺服器產生某些頁面時（例如錯誤訊息頁面），就會顯示這個信箱。# 例如：admin@your-domain.com#ServerAdmin admin@example.com## ServerName 是用來設定伺服器用什麼名稱跟 port 號代表自己。# 雖然很多時候系統會自動抓，但還是建議直接手動寫死，避免啟動時出狀況。## 如果您的主機沒有申請好的 DNS 域名，這裡就直接填它的 IP 位址。#ServerName rb.baccarat.org:80## 預設會直接擋掉所有存取伺服器檔案系統的請求。# 您必須在其他地方，手動開放網頁內容目錄的存取權限。# <Directory> blocks below.#<Directory />    AllowOverride none    Require all denied</Directory>## 要注意從這裡開始，所有的功能都必須手動開啟才有用。# 所以如果發現有些功能運作不如預期，先確認一下是不是忘了在下面手動開啟它。### DocumentRoot：用來放網頁檔案的根目錄。# 預設情況下，所有的請求都會來這個目錄找檔案，# 不過您也可以用捷徑（symbolic links）或別名（aliases）指向其他地方。#DocumentRoot "D:/Robot_Program/wwwroot"<Directory "D:/Robot_Program/wwwroot">    #    # Options 指令的可用值包括 "None"、"All"，    # 或以下各項的任意組合：    # Indexes Includes FollowSymLinks SymLinksifOwnerMatch ExecCGI MultiViews    #    # 請注意，「MultiViews」必須*明確*指定－僅使用「Options All」並不會包含它。    #    # Options 指令既複雜又重要。有關更多資訊，請參閱    # http://httpd.apache.org/docs/2.4/mod/core.html#options    #    Options FollowSymLinks    #    # AllowOverride 是用來控制哪些指令可以寫在 .htaccess 檔裡面。    # 您可以設定成 All、None，或是組合這幾個關鍵字：    # AllowOverride FileInfo AuthConfig Limit。    #    AllowOverride None    #    # 這是用來控制誰可以從這台伺服器抓資料。    #    Require all granted</Directory>## DirectoryIndex：用來設定當有人存取某個目錄時，Apache 的預設解析檔案。#<IfModule dir_module>    DirectoryIndex index.php index.html</IfModule>## 底下這幾行是用來擋掉 Web 客戶端，不讓他們看到 .htaccess 和 .htpasswd 這類檔案。#<Files ".ht*">    Require all denied</Files>## ErrorLog：這是錯誤日誌檔存放的位置。# 如果您沒有在 <VirtualHost> 區塊裡面另外指定 ErrorLog，# 該虛擬主機的錯誤訊息就會記錄在這裡。# 相對的，如果您有在 <VirtualHost> 裡面定義自己的錯誤日誌檔，# 錯誤就會跑去那邊，不會記在這裡。#ErrorLog "logs/error.log"## LogLevel：用來控制要寫多少訊息到 error_log 裡面。# 可以填的值包含：debug、info、notice、warn、error、crit、alert、emerg。#LogLevel warn<IfModule log_config_module>    #    # 下面這些指令是用來定義一些格式暱稱，方便給 CustomLog 指令（見下方）調用。    #    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined    LogFormat "%h %l %u %t \"%r\" %>s %b" common    <IfModule logio_module>      # 如果要用 %I 和 %O 的話，記得要先啟用 mod_logio.c。      LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %I %O" combinedio    </IfModule>    #    # 這是連線紀錄檔（Common Logfile Format）的位置跟格式。    # 如果您沒有在 <VirtualHost> 區塊裡面另外設定連線紀錄檔，所有的存取紀錄就會寫在這裡。    # 相反的，如果您有幫個別 <VirtualHost> 設定專屬的連線紀錄檔，     # 紀錄就會寫去各自的檔案，不會存在這個檔案裡。    #    CustomLog "logs/access.log" common    #    # 如果您希望紀錄檔裡面包含連線、瀏覽器 Agent     # 和 Referer 等完整資訊（Combined Logfile Format），可以使用下面這個指令。    #    #CustomLog "logs/access.log" combined</IfModule><IfModule alias_module>    #    # Redirect：這個設定是用來告訴使用者，某些原本在伺服器上的檔案已經搬家了。    # 使用者收到通知後，會自動去新的網址重新抓取檔案。    # 例如：Redirect permanent /foo http://www.example.com/bar    #    # Alias：可以把網頁路徑直接對應到伺服器的檔案系統路徑，    # 專門用來讀取那些沒有放在 DocumentRoot 底下的內容。    # 例如：Alias /webpath /full/filesystem/path    #    # 如果您在 /webpath 後面加了斜線 /，那使用者輸入 URL 時也一定要加上斜線。    # 另外，您通常還需要設定一個 <Directory> 區塊，這樣伺服器才會開放讀取該檔案系統路徑的權限。    #    # ScriptAlias：這是用來指定哪些資料夾裡面放了伺服器腳本（CGI）。    # 它運作起來跟 Alias 差不多，差別只在于這個資料夾裡的檔案會被伺服器當成應用程式直接執行，    # 而不是當成普通檔案寄給瀏覽器。    # 另外，結尾斜線 "/" 的規則也跟 Alias 一模一樣。    #    ScriptAlias /cgi-bin/ "${SRVROOT}/cgi-bin/"</IfModule><IfModule cgid_module>    #    # ScriptSock：如果您用的是多執行緒的伺服器，    # 這個是用來指定跟 mod_cgid 的 CGI daemon 溝通時，所使用的 UNIX socket 路徑。    #    #Scriptsock cgisock</IfModule>## 如果您有設定 ScriptAlias 的 CGI 資料夾，# 記得把 "${SRVROOT}/cgi-bin" 改成您實際存放 CGI 的資料夾路徑。#<Directory "${SRVROOT}/cgi-bin">    AllowOverride None    Options None    Require all granted</Directory><IfModule mod_deflate.c># 告訴 Apache 對傳輸到瀏覽器的內容進行壓縮SetOutputFilter DEFLATE# 壓縮等級 9DeflateCompressionLevel 9#不進行壓縮的圖像檔案類型，分別是 gif，jpg，jpeg，pngSetEnvIfNoCase Request_URI .(?:gif|jpe?g|png)$ no-gzip dont-vary</IfModule><IfModule headers_module>    #    # 為了避免還沒修復 "httpoxy" 漏洞的 CGI 或後端代理伺服器出問題，    # 這裡會擋掉 HTTP_PROXY 環境變數。    # 因為 'Proxy' request header 既沒有被 IETF 定義，也沒有列在 IANA 的規範裡。    #    RequestHeader unset Proxy early</IfModule><IfModule mime_module>    #    # TypesConfig 用來指定設定檔的位置，    # 那個檔案裡面記了副檔名跟 MIME-type 的對應關係。    #    TypesConfig conf/mime.types    #    # AddType 可以讓您針對特定的檔案類型，    # 新增或覆蓋掉 TypesConfig 設定檔裡面的 MIME 設定。    #    #AddType application/x-gzip .tgz    #    # AddEncoding 可以讓某些瀏覽器在收到資料時自動解壓縮。    # 不過要注意，不是每個瀏覽器都支援這個功能。    #    #AddEncoding x-compress .Z     #AddEncoding x-gzip .gz .tgz    #    # 如果您把上面那幾行 AddEncoding 拿掉了，    # 那您可能就要把這些副檔名改成定義成普通的媒體類型：    #    AddType application/x-compress .Z    AddType application/x-gzip .gz .tgz    #    # AddHandler 可以讓您把特定的副檔名綁定到「處理器（handler）」，    # 執行跟檔案類型無關的動作。這些處理器可以是伺服器內建的，    # 或者是用 Action 這個 directive 另外加進來的（請看下面）。    #    # 如果您要在 ScriptAliased 指定以外的地方執行 CGI script，    # 可以用這個：（記得還要到 "Options" 那邊加上 "ExecCGI"）    #    #AddHandler cgi-script .cgi    # 如果要用 type map（內容協商功能）的話，這樣設定：    #AddHandler type-map var    #    # Filter 可以讓您在把內容傳給客戶端之前先處理過。    #    # 如果要讓伺服器解析 .shtml 檔案裡的 SSI（server-side includes）。    # 記得還要到 "Options" 那邊加上 "Includes"    #    #AddType text/html .shtml    #AddOutputFilter INCLUDES .shtml      AddType application/x-httpd-php   .php</IfModule>## mod_mime_magic 這個模組會去讀檔案裡面的內容，靠這些特徵來判斷檔案類型。# 而 MIMEMagicFile 這個指令，就是告訴模組這些特徵定義檔放在哪裡。## MIMEMagicFile conf/magic## 客製化錯誤回應主要有三種方式：1) 直接輸出純文字 2) 轉址到內部的頁面 3) 轉址到外部的網址## 舉幾個例子：#ErrorDocument 500 "The server made a boo boo."#ErrorDocument 404 /missing.html#ErrorDocument 404 "/cgi-bin/missing_handler.pl"#ErrorDocument 402 http://www.example.com/subscription_info.html### MaxRanges 用來限制單一請求最多能包含幾個 Range。# 如果超過這個數量，伺服器就會直接回傳整個檔案。# 您也可以設定成 'default'、'none' 或 'unlimited' 這種特殊值。# 預設最多可以接受 200 個 Range。 #MaxRanges unlimited## EnableMMAP 和 EnableSendfile：如果您的系統支援，# 伺服器可以用記憶體對映（memory-mapping）或 sendfile 系統呼叫來傳送檔案，# 這樣通常能提昇伺服器效能。# 不過，如果是讀取網路掛載的檔案系統，或是系統對這兩個功能支援有問題時，# 就一定要關掉。預設值是: EnableMMAP On、EnableSendfile Off。##EnableMMAP off#EnableSendfile on# 補充設定## 您可以引入 conf/extra/ 目錄下的設定檔來擴充功能或修改預設設定；# 或者也可以直接把裡面的內容複製到這裡，再依需求調整。# 伺服器連線池管理（依 MPM 類型而定）Include conf/extra/httpd-mpm.conf# 多語言錯誤訊息#Include conf/extra/httpd-multilang-errordoc.conf# 美化目錄列表#Include conf/extra/httpd-autoindex.conf# 語系設定#Include conf/extra/httpd-languages.conf# 使用者個人目錄#Include conf/extra/httpd-userdir.conf# 即時請求與設定資訊#Include conf/extra/httpd-info.conf# 虛擬主機Include conf/extra/httpd-vhosts.conf# 本地端讀取 Apache HTTP Server 使用手冊#Include conf/extra/httpd-manual.conf# 分散式創作與版本控制 (WebDAV)#Include conf/extra/httpd-dav.conf# 各式預設設定#Include conf/extra/httpd-default.conf# 設定 mod_proxy_html 解析 HTML4/XHTML1<IfModule proxy_html_module>Include conf/extra/proxy-html.conf</IfModule># 安全（SSL/TLS）連線Include conf/extra/httpd-ssl.conf## 注意：在沒有 /dev/random 類似機制的平台上記得要加這段，# 否則內建 statically compiled-in mod_ssl 時會沒辦法在不開 SSL 的狀況下正常啟動。#<IfModule ssl_module>SSLRandomSeed startup builtinSSLRandomSeed connect builtin</IfModule>