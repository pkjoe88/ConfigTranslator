# 虛擬主機（Virtual Hosts）
#
# 需要啟動的模組：mod_log_config

# 如果你想在一台伺服器上架設多個網域或主機名稱，可以幫它們設定 VirtualHost 區塊。大部分的設定都是用「域名型」的虛擬主機（name-based
# virtual hosts），這樣伺服器就不用去管 IP 位址的問題。底下指令裡的星號，就是代表這個意思。
#
# 在開始設定虛擬主機之前，請先參考這份說明文件：
# <URL:http://httpd.apache.org/docs/2.4/vhosts/>
# 來了解更多詳細細節。
#
# 你可以用指令列參數 '-S' 來檢查虛擬主機的設定有沒有寫錯。

#
# VirtualHost 設定範例：幾乎所有的 Apache 指令都可以寫在 VirtualHost 區塊裡面。只要請求沒有匹配到任何
# <VirtualHost> 區塊裡的 ServerName 或 ServerAlias，系統預設就會直接交給第一個 VirtualHost 區塊來處理。
#
<VirtualHost *:80>
    # 設定主機名稱
    ServerName phg66.com.com
    # 設定主機別名，也就是用這個別名也能連得上（前提是 DNS 域名解析要設定正確）
    ServerAlias www.phg66.com
    # 設定這個網站的根目錄
    DocumentRoot "D:/Robot_Program/wwwroot"
    # 設定資料夾存取權限，裡面的路徑要跟上一行的 DocumentRoot 一樣
    <Directory "D:/Robot_Program/wwwroot">
        # 用 Options Indexes 來設定「允許顯示檔案清單」（當目錄下找不到預設網頁時會用到）
	Options All FollowSymLinks IncludesNOEXEC Indexes
        # 讓 .htaccess 檔案可以控制這個資料夾的存取權限
        AllowOverride All
        # 處理請求的設定
        Require all granted
        # 設定預設打開的首頁
        DirectoryIndex index.php index.html
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    # 設定主機名稱（ServerName）
    ServerName rb.phg66.com
    # 設定主機別名，也就是用這個別名也能連進來（前提是 DNS 域名解析要設定對）。用 ServerAlias study.com 來設定這個網站的根目錄
    DocumentRoot "D:/Robot_Program/wwwroot/member"
    # 設定這個資料夾的存取權限，裡面的路徑要跟上一行的 DocumentRoot 一模一樣
    <Directory "D:/Robot_Program/wwwroot/member">
        # 設定 Options Indexes，這樣當目錄下沒有預設首頁時，就會直接把裡面的檔案列表顯示出來
	Options All FollowSymLinks IncludesNOEXEC Indexes
        # 讓 .htaccess 檔案可以控制這個資料夾的存取權限
        AllowOverride All
        # 處理請求的設定
        Require all granted
        # 設定預設打開的首頁
        DirectoryIndex index.php index.html
    </Directory>
</VirtualHost>



