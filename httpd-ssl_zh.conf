## 這份是 Apache 伺服器用來支援 SSL 的設定檔。
# 裡面包含了各種指令，用來告訴伺服器要怎麼透過 https 連線來提供網頁。
# 如果想看這些指令的詳細說明，可以參考
# <URL:http://httpd.apache.org/docs/2.4/mod/mod_ssl.html>
# # 千萬不要還沒搞懂這些設定的作用，就照著裡面的說明盲目照做。
# 這裡寫的都只是提示跟提醒而已。
# 如果有不確定的地方，一定要去查線上說明文件。話先說在前面囉。
## 必須啟動的模組有：mod_log_config、mod_setenvif、mod_ssl，
# 還有 socache_shmcb_module（這是給 SSLSessionCache 預設值用的）。

## 偽隨機數生成器（PRNG）：這裡要設定一個或多個來源，
# 來產生 SSL 函式庫需要的 PRNG 隨機種子。隨機資料的品質要夠好才行。
# 要注意的是！在某些平台上，如果系統的隨機熵不夠，/dev/random 就會卡住不回應。
# 這代表你這時不能用 /dev/random，不然連線會等非常久（要一直等到系統收集到足夠的隨機熵為止）。
# 不過這些平台通常會另外提供一個不會卡住的 /dev/urandom，所以如果有的話，請改用這個。
# 想了解更多細節可以看 mod_ssl 的使用手冊。
## SSLRandomSeed startup file:/dev/random  512
# SSLRandomSeed startup file:/dev/urandom 512
# SSLRandomSeed connect file:/dev/random  512
# SSLRandomSeed connect file:/dev/urandom 512

## 當我們有開 SSL 的時候，除了前面提到的標準 HTTP 通訊埠之外，也必須監聽 HTTPS 的通訊埠。
#Listen 443
### SSL 全域設定區塊
### 在這個區塊裡面的所有 SSL 設定，都會同時套用到主伺服器跟所有有開 SSL 的虛擬主機上。
##
# SSL 加密演算法組合（Cipher Suite）：這裡用來指定允許前端客戶端協商的加密法，
# 以及 httpd# 作為代理伺服器連去後端時會用的加密法。
# 完整列表請參考 OpenSSL 的文件，並確保這些設定符合目前部署的最佳實踐。
# httpd 2.2.30、2.4.13 以及更新的版本已經強制停用 aNULL、eNULL 和 EXP 這幾種加密法，
# 而 OpenSSL 則是在 0.9.8zf、1.0.0r、1.0.1m、1.0.2a 版本就預設停用了。
SSLCipherSuite HIGH:MEDIUM:!MD5:!RC4:!3DESSSLProxyCipherSuite HIGH:MEDIUM:!MD5:!RC4:!3DES# 到了 2016 年底，原則上應該只留 TLSv1.2 的加密法才對。
# 舊的加密法要儘快停用，另外 kRSA 這種加密法並不支援前向安全性（forward secrecy）。
# 做這些變更會導致比較舊的客戶端（例如 Windows XP 上的 IE6 SP2、IE8，或其他舊版非瀏覽器的工具）沒辦法成功連上來。
## 如果你想限制 mod_ssl 只用 TLSv1.2 的加密法，並停用那些不支援前向安全性的協定，
# 請儘快把上面的 SSLCipherSuite 和 SSLProxyCipherSuite 指令替換成下面這兩行： 
# SSLCipherSuite HIGH:MEDIUM:!SSLv3:!kRSA
# SSLProxyCipherSuite HIGH:MEDIUM:!SSLv3:!kRSA

# 一般的瀏覽器（User Agent）通常不會主動替使用者平衡安全性與效能，
# 所以這件事必須由網站管理者來決定，由管理者去權衡 CPU# 負載與資料保密性，
# 因此這裡要強制採用伺服器這邊指定的加密法順序。
SSLHonorCipherOrder on 
# SSL 協定支援設定：這裡是用來指定允許用戶端連線的協定版本。預設會直接關掉 SSLv3（參考 RFC 7525 3.1.1）。TLSv1 (1.0)
# 最好儘快停用，照理說 2016 年底之後就應該只留 TLSv1.2 或更新的版本了。
SSLProtocol all -SSLv3SSLProxyProtocol all -SSLv3
# 密碼輸入視窗設定：這裡是用來設定怎麼抓取密碼。
# 用來過濾的視窗程式（`builtin` 是指內建的終端機對話視窗）必須要把密碼輸出到 stdout。
SSLPassPhraseDialog  builtin
# 跨程序 Session 快取：這裡用來設定 SSL Session Cache，
# 第一個要設的是使用的機制，第二個是過期時間（單位是秒）。
# SSLSessionCache	 "dbm:${SRVROOT}/logs/ssl_scache"
SSLSessionCache        "shmcb:${SRVROOT}/logs/ssl_scache(512000)"
SSLSessionCacheTimeout  300

# OCSP Stapling（需要 OpenSSL 0.9.8h 或更新的版本）
#
# 這個功能預設是關掉的，如果要開，至少要設定 SSLUseStapling 和 SSLStaplingCache 這兩個指令。想了解更多細節可以參考
# SSL/TLS How-To 裡面的 OCSP Stapling 文件。
#
# 讓所有開了 SSL 的伺服器都啟用 Stapling 功能：SSLUseStapling On

# 用跟上面 SSL session cache 一樣的機制，幫 OCSP Stapling 設定一個不算大的快取。如果這台伺服器有好幾張憑證都要用
# stapling，快取容量可能就要調大一點。（空間不夠的話會紀錄 AH01929 錯誤。）SSLStaplingCache
# "shmcb:${SRVROOT}/logs/ssl_stapling(32768)"

# 有效的 OCSP 回應要在快取裡面放幾秒才會過期：SSLStaplingStandardCacheTimeout 3600

# 無效的 OCSP 回應要在快取裡面放幾秒才會過期：SSLStaplingErrorCacheTimeout 600

##
# SSL 虛擬主機設定範疇（Virtual Host Context）
##

<VirtualHost _default_:443>

# 虛擬主機的基本一般設定
DocumentRoot "${SRVROOT}/htdocs"
ServerName www.example.com:443
ServerAdmin admin@example.com
ErrorLog "${SRVROOT}/logs/error.log"
TransferLog "${SRVROOT}/logs/access.log"

# SSL 開關：用來切換這個虛擬主機要不要啟用 SSL。
SSLEngine on

# 伺服器憑證：把 SSLCertificateFile 指到 PEM 編碼的憑證檔。如果這張憑證有加密，系統會跳出提示要你輸入
# passphrase。要注意的是，執行 kill -HUP 重啟時也會再問一次。另外，如果你同時有 RSA 和 DSA
# 憑證，可以兩個一起設定（這樣才能支援像 DSA 加密密碼組之類的）。有些 ECC cipher suites
# (http://www.ietf.org/rfc/rfc4492.txt) 會需要 ECC 憑證，這同樣也能並行設定。
SSLCertificateFile "${SRVROOT}/conf/server.crt"
# SSLCertificateFile "${SRVROOT}/conf/server-dsa.crt" SSLCertificateFile
# "${SRVROOT}/conf/server-ecc.crt"

# 伺服器私鑰：如果私鑰沒有跟憑證包在同一檔，就要用這個指令指到你的私鑰檔。要是你有 RSA 跟 DSA 的私鑰，兩個是可以同時設定的（這樣才能支援 DSA
# 密碼組等功能）。如果用的是 ECC 私鑰，一樣能並行設定。
SSLCertificateKeyFile "${SRVROOT}/conf/server.key"
# SSLCertificateKeyFile "${SRVROOT}/conf/server-dsa.key" SSLCertificateKeyFile
# "${SRVROOT}/conf/server-ecc.key"

# 伺服器憑證鏈：把 SSLCertificateChainFile 指到包含串接好的 PEM 編碼 CA
# 憑證檔，也就是這張伺服器憑證的憑證鏈。圖個方便的話，如果是直接把 CA 憑證附在伺服器憑證後面，這裡也可以直接設成跟
# SSLCertificateFile 同一個檔案。 SSLCertificateChainFile "${SRVROOT}/conf/server-
# ca.crt"

# 憑證簽發機構 (CA)：這裡用來設定驗證用戶端時，要去哪裡找 CA 憑證。你可以指定一個路徑，或是直接用一個把所有 CA
# 憑證包進去的單一大檔（檔案必須是 PEM 編碼）。注意：在 SSLCACertificatePath 裡面，你需要建立 hash symlinks
# 指向那些憑證檔。改完設定後，記得用隨附的 Makefile 來更新這些 hash symlinks。 SSLCACertificatePath
# "${SRVROOT}/conf/ssl.crt" SSLCACertificateFile "${SRVROOT}/conf/ssl.crt/ca-
# bundle.crt"

# 憑證撤銷清單 (CRL)：設定驗證用戶端時，去哪找 CA 的 CRL 撤銷清單，或是直接指定一個打包了所有 CRL 的單一大檔（檔案一樣要 PEM
# 編碼）。CRL 的檢查模式必須透過 SSLCARevocationCheck 來明確指定（沒設定的話預設是 "none"）。注意：在
# SSLCARevocationPath 裡面，要建立指向憑證檔的 hash symlinks，修改後請用隨附的 Makefile 來更新這些
# links。 SSLCARevocationPath "${SRVROOT}/conf/ssl.crl" SSLCARevocationFile
# "${SRVROOT}/conf/ssl.crl/ca-bundle.crl" SSLCARevocationCheck chain

# 用戶端驗證（類型）：用來設定用戶端憑證的驗證類型跟檢查深度。類型有 none、optional、require 和
# optional_no_ca。深度指的是數字，代表在判定憑證無效前，最多往上追蹤幾層憑證簽發鏈。 SSLVerifyClient require
# SSLVerifyDepth  10

# TLS-SRP 雙向驗證：啟用 TLS-SRP 並設定 OpenSSL SRP verifier 檔案的路徑（裡面存有 SRP
# 帳號的登入資訊）。這功能需要 OpenSSL 1.0.1 或更新版本。怎麼建立這個檔案可以參考 mod_ssl 的 FAQ，例如："openssl
# srp -srpvfile ${SRVROOT}/conf/passwd.srpv -add username" SSLSRPVerifierFile
# "${SRVROOT}/conf/passwd.srpv"

# 存取控制：透過 SSLRequire，你可以針對個別資料夾做存取控制。它支援各種複雜的邏輯判斷（包含伺服器變數檢查或其他查詢指令），語法有點像 C 加
# Perl 的混合。詳細說明可以看 mod_ssl 的官方文件。
#<Location />
# SSLRequire (    %{SSL_CIPHER} !~ m/^(EXP|NULL)/ \ and %{SSL_CLIENT_S_DN_O}
# eq "Snake Oil, Ltd." \ and %{SSL_CLIENT_S_DN_OU} in {"Staff", "CA", "Dev"} \
# and %{TIME_WDAY} >= 1 and %{TIME_WDAY} <= 5 \ and %{TIME_HOUR} >= 8 and
# %{TIME_HOUR} <= 20       ) \ or %{REMOTE_ADDR} =~ m/^192\.76\.162\.[0-9]+$/
#</Location>

# SSL 引擎選項：設定 SSL 引擎的各種細項。 o FakeBasicAuth：把用戶端的 X.509 憑證轉成 Basic
# 驗證格式。這樣一來就能直接用標準的 Auth/DBMAuth 來做權限控管。使用者名稱會取用戶端 X.509
# 憑證的「單行」格式。注意，這不會拿使用者的密碼，在密碼檔裡的每個帳號都必須統一用這個預設密碼：`xxj31ZMTZzkVA`。 o
# ExportCertData：這會另外導出兩個環境變數：SSL_CLIENT_CERT 和 SSL_SERVER_CERT。裡面存的是 PEM
# 編碼的憑證內容，伺服器憑證一定會有，用戶端憑證則是只有在開啟驗證時才會拿到。方便你在 CGI 腳本裡直接抓憑證來用。 o
# StdEnvVars：導出標準的 SSL/TLS `SSL_*`
# 環境變數。因為抓這些變數滿吃效能的，而且處理靜態網頁時通常用不到，所以預設是關掉的。一般只會在需要處理 CGI 或 SSI 請求時才開啟。 o
# StrictRequire：就算遇到 "Satisfy any" 的情況，只要觸發了 "SSLRequireSSL" 或
# "SSLRequire"，就會直接擋掉存取，其他模組都沒辦法蓋過這個拒絕結果。 o OptRenegotiate：如果是在目錄層級的設定（per-
# directory context）裡使用 SSL 指令，開啟這個可以優化 SSL 連線重商討（renegotiation）的處理流程。
# SSLOptions +FakeBasicAuth +ExportCertData +StrictRequire
<FilesMatch "\.(cgi|shtml|phtml|php)$">
    SSLOptions +StdEnvVars
</FilesMatch>
<Directory "${SRVROOT}/cgi-bin">
    SSLOptions +StdEnvVars
</Directory>

# SSL 協定調整：預設且安全的做法是符合 SSL/TLS 標準的關閉方式，也就是 mod_ssl 會發送 close notify
# alert，但不會去等用戶端回傳 close notify alert。如果你需要改用其他的關閉方式，可以使用下面這幾個變數： o ssl-
# unclean-shutdown：這會強制在連線中斷時採用非乾淨的關閉方式，也就是完全不傳送、也不接收 SSL close notify
# alert。雖然這違反了 SSL/TLS 標準，但有些寫得很爛的瀏覽器一定要這樣搞。如果你用標準做法（也就是 mod_ssl 有傳送 close
# notify alert）卻會跳 I/O 錯誤，就可以用這個設定。 o ssl-accurate-
# shutdown：這會強制採用完全精確的關閉方式，也就是 mod_ssl 傳送 SSL close notify alert 後，會一直等到用戶端也回傳
# close notify alert。這 100% 符合 SSL/TLS
# 標準，但在實務上經常會導致那些寫得很爛的瀏覽器卡住連線。建議只在你確定該瀏覽器的 SSL 機制運作完全正常時才用這個。
# 注意：大部分問題用戶端出狀況，也跟 HTTP keep-alive 功能有關，所以你通常也會想順便幫這些用戶端停用 keep-alive。這時候可以使用
# "nokeepalive" 這個變數。同理，有些用戶端的 HTTP/1.1 寫得太爛，你必須強制它們改用 HTTP/1.0 來避開問題，這時就可以用
# "downgrade-1.0" 和 "force-response-1.0" 這兩個變數。
BrowserMatch "MSIE [2-5]" \
         nokeepalive ssl-unclean-shutdown \
         downgrade-1.0 force-response-1.0

# 伺服器獨立日誌：用來指定自訂 SSL log 檔的位置。如果你想幫個別的 virtual host 記錄一份簡短、不包含錯誤訊息的 SSL
# 日誌，就可以用這個設定。
CustomLog "${SRVROOT}/logs/ssl_request.log" \
          "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"

</VirtualHost>