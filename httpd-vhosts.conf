# Virtual Hosts
#
# Required modules: mod_log_config

# If you want to maintain multiple domains/hostnames on your
# machine you can setup VirtualHost containers for them. Most configurations
# use only name-based virtual hosts so the server doesn't need to worry about
# IP addresses. This is indicated by the asterisks in the directives below.
#
# Please see the documentation at 
# <URL:http://httpd.apache.org/docs/2.4/vhosts/>
# for further details before you try to setup virtual hosts.
#
# You may use the command line option '-S' to verify your virtual host
# configuration.

#
# VirtualHost example:
# Almost any Apache directive may go into a VirtualHost container.
# The first VirtualHost section is used for all requests that do not
# match a ServerName or ServerAlias in any <VirtualHost> block.
#
<VirtualHost *:80>
    #設定主機名
    ServerName phg66.com.com
    #設定主機別名，即用該別名也可以訪問(前提是域名解析正確)
    ServerAlias www.phg66.com
    #設定該站點根目錄
    DocumentRoot "D:/Robot_Program/wwwroot"
    #設定資料夾訪問控制，其路徑要和上一行的DocumentRoot一樣,
    <Directory "D:/Robot_Program/wwwroot">
        #用於顯示設定“可顯示檔案列表”(當無可顯示網頁的時候)
        #Options Indexes
	Options All FollowSymLinks IncludesNOEXEC Indexes
        #啟用資料夾訪問控制的檔案.htaccess設定
        AllowOverride All
        #請求控制
        Require all granted
        #預設開啟的頁面設定
        DirectoryIndex index.php index.html
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    #設定主機名
    ServerName rb.phg66.com
    #設定主機別名，即用該別名也可以訪問(前提是域名解析正確)
    #ServerAlias study.com
    #設定該站點根目錄
    DocumentRoot "D:/Robot_Program/wwwroot/member"
    #設定資料夾訪問控制，其路徑要和上一行的DocumentRoot一樣,
    <Directory "D:/Robot_Program/wwwroot/member">
        #用於顯示設定“可顯示檔案列表”(當無可顯示網頁的時候)
        #Options Indexes
	Options All FollowSymLinks IncludesNOEXEC Indexes
        #啟用資料夾訪問控制的檔案.htaccess設定
        AllowOverride All
        #請求控制
        Require all granted
        #預設開啟的頁面設定
        DirectoryIndex index.php index.html
    </Directory>
</VirtualHost>



