[PHP]
;;;;;;;;;;;;;;;;;;;; 關於 php.ini ;
;;;;;;;;;;;;;;;;;;;
; PHP 的初始化檔案通常叫 php.ini，主要用來設定 PHP 各方面的行為模式。

; PHP 會從好幾個地方嘗試尋找並載入這個設定檔，搜尋的優先順序如下：
; 1. 各個 SAPI 模組指定的特定位置。
; 2. PHPRC 環境變數。
; 3. Windows 機碼中預先定義好的幾個位置。
; 4. 目前的工作目錄（CLI 模式除外）。
; 5. Web Server 的目錄（給 SAPI 模組用的），或者 PHP 自己的安裝目錄（Windows 的其他情況）。
; 6. 當初編譯時用 --with-config-file-path 指定的目錄，或者是 Windows 的系統目錄（通常是 C:\windows）。
; 想了解更詳細的資訊可以看官方文件： https://php.net/configuration.file
; 這個檔案的語法非常簡單。空白字元跟分號開頭的行都會直接被忽略（您應該也猜到了）。
; 另外，像 [Foo] 這種區塊標題（Section headers）目前也會被直接忽略，雖然以後可能會用得到。
; 在 [PATH=/www/mysite] 這個區塊標題底下的設定，只會套用到 /www/mysite 目錄裡面的 PHP 檔案。
; 在 [HOST=www.example.com] 底下的設定，就只對網站是 www.example.com 的 PHP 檔案生效。
; 這些特殊區塊裡設好的參數，是沒辦法被使用者自訂的 INI 檔或是執行期程式碼蓋掉的。
; 目前 [PATH=] 跟 [HOST=] 這兩種區塊只能在 CGI/FastCGI 模式下運作。詳情可以參考：https://php.net/ini.sections
; 設定參數（Directives）的寫法如下：
; directive = value
; 參數名稱是*大小寫有分*的，寫 foo=bar 跟 FOO=bar 會被當成不一樣的東西。
; 參數其實就是拿來設定 PHP 本身或其擴充套件（extensions）的變數。
; 系統不會去檢查您名稱有沒有寫錯，如果 PHP 因為沒設定或打錯字而找不到某個參數，它就會直接吃預設值。
; 設定值可以是字串、數字、PHP 常數（像 E_ALL 或 M_PI）、INI 專用的常數（On, Off, True, False, Yes, No 和 None）、
; 運算式（像 E_ALL & ~E_NOTICE）、加引號的字串（"bar"），或者是引用之前設過的變數或參數（像 ${foo}）。
; INI 檔裡面的運算式只支援位元運算子跟括號：
; | 代表位元 OR。
; ^ 代表位元 XOR。
; & 代表位元 AND。
; ~ 代表位元反轉（NOT）。
; ! 代表布林值（NOT）。
; 要開啟布林值的開關，可以用 1、On、True 或 Yes。要關掉的話，就用 0、Off、False 或 No。
; 如果您想把值設成空字串，只要在等號後面留白，或者寫 None 關鍵字就可以了：
; foo =         ; 將 foo 設為空字串; foo = None    ; 將 foo 設為空字串; foo = "None"  ; 將 foo 設為字串 'None'
; 如果您在設定值裡面用了常數，而且這個常數是屬於動態載入的擴充套件（不管是 PHP 還是 Zend; extension），
; 那您一定要把設定寫在載入該擴充套件的那一行*之後*才行。
;;;;;;;;;;;;;;;;;;;; 關於這個檔案；
;;;;;;;;;;;;;;;;;;;
; PHP 原廠有附兩種 INI 設定檔。一個是建議在正式上線環境用的，另一個則是建議在開發環境用的。
; php.ini-production 的設定主要是以安全性、效能還有最佳實務為核心。
; 不過要特別注意，這些設定可能會讓一些比較舊、或是當初安全機制沒做好的應用程式抓不到或跑不起來。
; 我們建議您在正式環境跟測試環境，都套用這份 production 的設定檔。
; php.ini-development 跟正式版的內容很像，差在它會把錯誤訊息顯示得非常詳細。
; 我們建議這份開發版只在開發環境用就好，因為如果直接把錯誤訊息秀給一般使用者看，很可能會不小心把一些敏感的資安資訊洩漏出去。
; 這份就是 php.ini-production 設定檔。
;;;;;;;;;;;;;;;;;;;; 快速參考；
;;;;;;;;;;;;;;;;;;;
; 下面整理出 production 和 development 這兩份設定檔，跟 PHP 預設行為不太一樣的地方。
; 如果想了解為什麼會建議這樣調整 PHP 的行為，可以看這份文件後面的詳細設定說明。
; display_errors;   預設值是 On;   開發環境建議設為 On;   正式環境同樣建議設為Off; display_startup_errors;   預設值是 On;   開發環境建議設為 On;   正式環境同樣建議設為Off
; error_reporting
;   預設值是 E_ALL
;   Development Value: E_ALL
;   正式環境同樣建議設為E_ALL & ~E_DEPRECATED & ~E_STRICT

; log_errors
;   預設值是 Off
;   開發環境建議設為 On
;   正式環境同樣建議設為On
; max_input_time
;   預設值是 -1 (無限制)
;   開發環境建議設為 60 (60 秒)
;   正式環境同樣建議設為 60 (60 秒)
; output_buffering 
;   預設值是 Off
;   開發環境建議設為 4096
;   正式環境同樣建議設為 4096

; register_argc_argv 
;   預設值是 On
;   開發環境建議設為 Off
;   正式環境同樣建議設為 Off
; request_order 
;   預設值是 None
;   開發環境建議設為 "GP"
;   正式環境同樣建議設為 "GP"
; session.gc_divisor 
;   預設值是 100
;   開發環境建議設為 1000
;   正式環境同樣建議設為 1000
; session.sid_bits_per_character 
;   預設值是 4
;   開發環境建議設為 5
;   正式環境同樣建議設為 5
; short_open_tag 
;  預設值是 On
;  開發環境建議設為 Off
;  正式環境同樣建議設為 Off

; variables_order 
;  預設值是 "EGPCS"
;  開發環境建議設為 "GPCS"
;  正式環境同樣建議設為 "GPCS"

; zend.exception_ignore_args
;  預設值是 Off
;  開發環境建議設為 Off
;  正式環境則建議設為 On。
; zend.exception_string_param_max_len 
;  預設值是 15
;  開發環境建議設為 15
;  正式環境則建議設為 0。
;;;;;;;;;;;;;;;;;;;;; php.ini 設定選項 ；
;;;;;;;;;;;;;;;;;;;;
; 這是用來設定使用者自訂 php.ini（像是 .htaccess 那種）檔名的選項，預設值是 ".user.ini"。
;user_ini.filename = ".user.ini"
; 如果您想關掉這個功能，把這個選項留白或設成空的就可以了。
;user_ini.filename =
; 使用者自訂 php.ini 檔案的快取時間（TTL），單位是秒。預設是 300 秒（也就是 5 分鐘）。
;user_ini.cache_ttl = 300
;;;;;;;;;;;;;;;;;;;;; 語言相關設定條目 ;
;;;;;;;;;;;;;;;;;;;;
; 在 Apache 底下開啟 PHP 程式語言引擎。
; https://php.net/engine
engine = On
; 這個設定用來控制 PHP 會不會去解析包在
; <? and ?> tags as PHP source which should be processed as such. It is
; 通常建議使用 <?php 和 ?>，並把這個功能關掉，因為開啟它可能會在產生 XML 文件時出錯。不過為了向下相容，目前還是有支援。
; 要注意的是，這個設定不會影響到 <?= 這個簡寫標籤，不管這項設定是開還是關，<?= 都可以正常使用。
;   預設值：On
;   開發環境建議值：Off
;   正式環境建議值：Off。
; https://php.net/short-open-tag
short_open_tag = Off
; 浮點數顯示時要保留的有效位數。
; https://php.net/precision
precision = 14
; Output buffering 是一種暫存機制，用來控制 PHP 把資料傳給客戶端之前，要在內部先快取多少輸出內容（標頭和 cookie; 不算）。
; 如果您的應用程式輸出的資料量超過這個設定值，PHP 就會依照您指定的尺寸大小，把資料分批傳出去。
; 開啟這個設定並控制最大暫存區，會根據您的應用程式和伺服器產生一些很有用的效果。
; 例如，即使您已經用 print 或 echo 輸出過內容，後面還是可以繼續傳送標頭和 cookie。
; 另外，因為快取輸出的關係，伺服器發出的網路封包變少了，比起 PHP 一有資料就直接 stream 出去，效能會更好。
; 考慮到效能，正式環境的伺服器建議設為 4096 bytes。
; 注意： Output buffering 也可以透過 Output Buffering Control 相關函式來控制。
; 可用的設定值：
;   On = 已啟用，且緩衝區無限制。 （請謹慎使用）;   Off = 關閉;   整數 = 啟用緩衝區，並以位元組為單位設定其最大大小。
; 注意：在 CLI SAPI 環境下，這個設定被硬性固定為 Off。
;   預設值：Off
;   開發環境建議值：4096
;   正式環境建議值：4096
; https://php.net/output-buffering
output_buffering = 4096
; 您可以把腳本所有的輸出內容，通通導導去給某個函式處理。
; 舉例來說，如果把 output_handler 設成 "mb_output_handler"，文字編碼就會自動轉成您指定的編碼。
; 只要設定了任何 output handler，系統就會自動開啟 output buffering。
; 注意：如果您寫的腳本是要在各種環境運行的，最好不要依賴這個 ini 設定，而是改用 ob_start() 來明確指定 output handler。
; 除非您非常清楚腳本在幹嘛，不然用這個設定可能會出問題。
; 注意："mb_output_handler" 跟 "ob_iconv_handler" 不能同時用，"ob_gzhandler" 跟 "zlib.output_compression" 也不能同時用。
; 注意：如果這裡設為 'On'，output_handler 必須保持留空！這種情況下您必須改用 zlib.output_handler。
; https://php.net/output-handler
;output_handler =
; URL 改寫功能利用 output buffer 在執行時即時改寫 URL。
; 您可以透過這個設定來指定要改寫哪些標籤。"form" 標籤比較特殊，它會自動插入 hidden input 標籤來帶入數值。
; 用法可以參考 session.trans_sid_tags。
;   預設值："form="
;   開發環境建議值："form="
;   正式環境建議值："form="
; url_rewriter.tags
; 預設情況下，URL 改寫器不會去改寫絕對路徑 URL 或表單。
; 如果要開啟絕對路徑的 URL 改寫，必須在執行時期（RUNTIME）定義好允許的主機名稱。
; 詳細資訊可以參考 session.trans_sid_hosts。
;  預設值：""
;  開發環境建議值：""
;  正式環境建議值：""
; url_rewriter.hosts
; 透過 zlib 函式庫自動對輸出內容做壓縮。這個選項可以設定為 'off'、'on'，或是直接指定壓縮要用的緩衝區大小（預設是; 4KB）。
; 注意：因為壓縮特性的關係，最後產出的資料區塊大小可能會不一樣，PHP 壓縮完後通常會輸出幾百 bytes 大小的區塊。
; 如果您想要大一點的區塊來換取更好的效能，可以另外把 output_buffering 開啟。
; 注意：您必須改用 zlib.output_handler，不能用一般的 output_handler，不然輸出的內容會壞掉。
; https://php.net/zlib.output-compression
zlib.output_compression = Off
; https://php.net/zlib.output-compression-level
;zlib.output_compression_level = -1
; 如果在這裡開啟了 zlib.output_compression，就不能再指定其他的 output handler 了。
; 這個設定的效果跟 output_handler 一樣，只是執行的順序不太一樣。
; https://php.net/zlib.output-handler
;zlib.output_handler =
; 開啟 implicit flush 的話，PHP 就會在每次有資料輸出時，自動叫輸出層把資料刷出來。
; 這就跟您在每次呼叫 print()、echo() 或輸出 HTML 區塊後面，都手動加一段 PHP 的 flush() 函式是一樣的意思。
; 把這個功能開啟會嚴重影響效能，所以通常只建議在 debug 時使用。
; https://php.net/implicit-flush
; 注意：在 CLI SAPI 環境下，這個設定被硬編碼強制開啟（On）。
implicit_flush = Off
; 當 unserialize 遇到一個還沒被定義的類別需要被實例化時，就會自動去呼叫這個 unserialize callback function，並把那個未定義的類別名稱當成參數傳進去。
; 如果您設定的函式根本不存在，或是那個函式沒有把缺少的類別檔 include 進來實作，系統就會跳警告。
; 所以除非您真的有要用到這個 callback 功能，不然這個欄位留空就好。
unserialize_callback_func =
; unserialize_max_depth 是用來設定反序列化資料結構時的預設深度限制。
; 如果把深度限制設太高，反序列化過程可能會導致堆疊溢位（stack overflow）。
; 這個 unserialize_max_depth 的 ini 設定，可以在個別呼叫 unserialize() 時用 max_depth 參數覆蓋掉。設定成 0 就代表不限制深度。
;unserialize_max_depth = 4096
; 序列化浮點數（floats & doubles）時，會保留小數點後 serialize_precision 所設定的有效位數。預設值可以確保用 unserialize 還原浮點數時資料不會變質。
; 另外，json_encode 在編碼 double 數值時也會用到這個值。如果設成 -1，就會使用 dtoa mode 0，讓系統自動選擇最好的精度。
serialize_precision = -1
; 如果設定了 open_basedir，所有檔案操作都會被限制只能在指定目錄跟它的子目錄下進行。
; 這個設定最適合放在每個目錄或每個虛擬主機（virtualhost）的網頁伺服器設定檔裡。
; 注意：設定這個會停用 realpath cache。
; https://php.net/open-basedir
;open_basedir =
; 這個設定可以讓您關掉特定的函式。您只要輸入您想停用的函式名稱，中間用逗號隔開就可以了。
; https://php.net/disable-functions
disable_functions =
; 這個設定可以讓您關掉特定的類別。您只要輸入您想停用的類別名稱，中間用逗號隔開就可以了。
; https://php.net/disable-classes
disable_classes =
; 語法高亮模式用的顏色設定。只要是 HTML 支援的格式都可以設定。
; <span style="color: ???????"> would work.; https://php.net/syntax-highlighting
;highlight.string  = #DD0000;highlight.comment = #FF9900;highlight.keyword = #007700;highlight.default = #0000BB;highlight.html    = #000000
; 開啟這個功能後，就算使用者中途中斷請求，PHP 還是會把整個 request; 執行完。
; 如果您的程式需要處理很久，很容易被使用者手動關掉或被瀏覽器判定逾時，就可以考慮把它開啟。
; PHP 預設是關閉這個功能的。
; https://php.net/ignore-user-abort
;ignore_user_abort = On
; 這個是用來設定 PHP 的 realpath 快取大小。如果您的系統會開一堆檔案，建議把這個值調大一點，比較能應付大量的檔案操作。
; 注意一下，如果有設 open_basedir 的話，這個快取功能就會自動停用。
; https://php.net/realpath-cache-size
;realpath_cache_size = 4096k
; 這個是設定檔案或目錄的 realpath 快取要保留幾秒。如果您的系統檔案很少動到，可以考慮把這個時間拉長一點。
; https://php.net/realpath-cache-ttl
;realpath_cache_ttl = 120
; 用來開啟或關閉循環引用（circular reference）的垃圾回收機制。
; https://php.net/zend.enable-gc
zend.enable_gc = On
; 開啟這個之後，您就可以用一些解析器原本不支援的編碼來寫腳本，像是 CP936、Big5、CP949 和 Shift_JIS 之類的。
; 不過要用這個功能的話，記得一定要先開 mbstring 擴充套件。
;zend.multibyte = Off
; 這個可以讓您設定腳本的預設編碼。除非您在腳本最上面寫了 "declare(encoding=...)"，不然都會套用這裡設的值。
; 注意這只有在 zend.multibyte 有開啟時才會生效。
;zend.script_encoding =
; 這個可以控制發生的 exception 產生堆疊追蹤（stack trace）時，要不要包含傳進去的參數。
; 正式環境建議開啟這個設定，才不會把敏感資訊印在堆疊追蹤裡面。
;  預設值：Off
;  開發環境：Off
;  正式環境：On
zend.exception_ignore_args = On
; 這個可以控制堆疊追蹤文字化之後，參數字串的最大長度，範圍可以設在 0 到 1000000 之間。
; 如果 zend.exception_ignore_args 已經開啟了，設這個就沒有效果。
;  預設值：15
;  開發環境：15
;  正式環境：0
;  正式環境建議設成 0，這樣比較不會把敏感資訊洩漏到堆疊追蹤裡面。
zend.exception_string_param_max_len = 0
;;;;;;;;;;;;;;;;;; 雜項 ;
;;;;;;;;;;;;;;;;;
; 決定要不要讓 PHP 透露自己安裝在這台伺服器上（例如在 Web 伺服器的 header 加上自己的標籤）。
; 雖然這不會造成安全漏洞，但別人就能藉此知道您的伺服器到底有沒有用 PHP。
; https://php.net/expose-php
expose_php = On
;;;;;;;;;;;;;;;;;;;; 資源限制 ;
;;;;;;;;;;;;;;;;;;;
; 每個腳本最多可以執行的秒數 https://php.net/max-execution-time 注意：在 CLI SAPI 環境下，這個設定直接被寫死成 0
max_execution_time = 30
; 每個腳本最多能花多少時間來解析請求的資料。正式環境最好限制一下這個時間，避免有些腳本莫名其妙跑太久。
; 注意：在 CLI SAPI 環境下，這個設定直接被寫死成 -1。
;  預設值：-1（不限制）
;  開發環境：60（60 秒）
;  正式環境：60（60 秒）
; https://php.net/max-input-time
max_input_time = 60
; 輸入變數最多可以巢狀包幾層
; https://php.net/max-input-nesting-level
;max_input_nesting_level = 64
; 最多可以接收多少個 GET/POST/COOKIE 輸入變數
;max_input_vars = 1000
; 最多可以接收多少個表單分段（就是輸入變數加上檔案上傳的總和）。預設值是 -1（也就是 max_input_vars 加 max_file_uploads
; 的總和）
;max_multipart_body_parts = 1500
; 單一程式最多可以吃掉多少記憶體
; https://php.net/memory-limit
memory_limit = 512M
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; 錯誤處理與紀錄 ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; 這個設定是告訴 PHP 哪些錯誤、警告或提醒需要處理。建議是用錯誤層級常數加上位元運算子來設定。 下面有列出常見的設定跟對應的意思供參考。
; 預設情況下，PHP 會處理除了 E_NOTICE 和 E_STRICT 之外的所有狀況，這兩個主要跟最佳實作和程式碼規範有關。
; 出於效能考量，生產環境建議這樣設定，畢竟正式伺服器不應該浪費資源去挑程式碼規範的毛病，那是開發環境跟開發設定該做的事。
; 順帶一提，php.ini-development 檔裡這個預設是 E_ALL，也就是什麼都會回報，這正好是您在開發跟早期測試時需要的。
;; 錯誤層級常數：
; E_ALL                                         - 所有錯誤跟警告
; E_ERROR                                   - 致命的執行階段錯誤
; E_RECOVERABLE_ERROR      - 接近致命的執行階段錯誤
; E_WARNING                            - 執行階段警告（非致命錯誤）
; E_PARSE                                    - 編譯階段的語法解析錯誤
; E_NOTICE                                  - 執行階段提醒（通常是程式碼有 bug 造成的，但也可能是您故意這樣寫，比如用了沒初始化的變數，打算讓它自動變成空字串）
; E_STRICT                                   - 執行階段提醒，開啟後 PHP 會建議您怎麼改程式碼，讓相容性和未來擴充性更好
; E_CORE_ERROR                       - PHP 開機啟動時發生的致命錯誤
; E_CORE_WARNING                - PHP 開機啟動時發生的警告（非致命錯誤）
; E_COMPILE_ERROR                 - 致命的編譯階段錯誤
; E_COMPILE_WARNING          - 編譯階段警告（非致命錯誤）
; E_USER_ERROR                        - 使用者自訂的錯誤訊息
; E_USER_WARNING                 - 使用者自訂的警告訊息
; E_USER_NOTICE                       - 使用者自訂的提醒訊息
; E_DEPRECATED                        - 警告某些程式碼在未來的 PHP 版本會無法運作
; E_USER_DEPRECATED            - 使用者自訂的廢棄警告
; 常用值：
; E_ALL（顯示所有錯誤、警告和提醒，包含程式碼規範）
; E_ALL & ~E_NOTICE（顯示所有錯誤，除了提醒）
; E_ALL & ~E_NOTICE & ~E_STRICT（顯示所有錯誤，除了提醒和程式碼規範警告）
; E_COMPILE_ERROR|E_RECOVERABLE_ERRO R|E_ERROR|E_CORE_ERROR（只顯示致命錯誤）
; 預設值：E_ALL 
; 開發環境建議值：E_ALL
; 生產環境建議值：E_ALL & ~E_DEPRECATED & ~E_STRICT
; https://php.net/error-reporting
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
; 這個設定用來控制 PHP 要不要顯示錯誤、提醒和警告，以及要噴在哪裡。
; 在開發階段把錯誤顯示出來很有用，但在正式環境會非常危險。根據觸發錯誤的程式碼不同， 很有可能會把資料庫帳密等敏感資訊漏出去。
; 正式環境我們建議把錯誤記進 log，而不是直接印在畫面上 (STDOUT)。可設定的值：
;   Off = 不顯示任何錯誤;   stderr = 將錯誤輸出至 STDERR（僅影響 CGI/CLI 模式）;   On 或 stdout = 把錯誤印在畫面上 (STDOUT
;           預設值：On
;           開發環境建議值：On
;           生產環境建議值：Off
; https://php.net/display-errors
display_errors = Off
; PHP 在開機啟動階段發生的錯誤，跟 display_errors 是分開控制的。強烈建議正式伺服器要設成 'off'，以免把系統設定細節洩漏出去。
;  預設值：On
;  開發環境建議值：On
;  生產環境建議值：Off
;  https://php.net/display-startup-errors
display_startup_errors = Off
; 除了把錯誤顯示出來，PHP 也可以把錯誤記到 log 檔、STDERR，或是下面 error_log 指定的位置。
; 雖然正式伺服器不該把錯誤直接秀給使用者看，但還是需要監控，記 log 就是個很棒的做法。
; 預設值：Off
; 開發環境建議值：On
; 生產環境建議值：On
; https://php.net/log-errors
log_errors = On
; 不要重複記錄一樣的訊息。除非有開 ignore_repeated_source，不然重複的錯誤必須發生在同一個檔案的同一行才會被濾掉。
; https://php.net/ignore-repeated-errors
ignore_repeated_errors = Off
; 在濾掉重複訊息時，順便忽略錯誤的來源。這個設定開了之後，就算重複的訊息是來自不同檔案或不同行，也不會被記進 log 裡。
; https://php.net/ignore-repeated-source
ignore_repeated_source = Off
; 如果這個設定關掉（Off），就不會顯示記憶體洩漏（memory leaks）的資訊（無論是印在 stdout 還是寫進 log）。
; 這只在 debug 自由編譯版本，而且 error reporting 有把 E_WARNING 放進允許清單時才有用。
; https://php.net/report-
; memleaks
report_memleaks = On
; 這個設定預設是關閉的。
;report_zend_debug = 0
; 關掉一般的錯誤回報，改為輸出 XML-RPC 格式的錯誤 XML。
; https://php.net/xmlrpc-errors
;xmlrpc_errors = 0
; XML-RPC 的 faultCode
;xmlrpc_error_number = 0
; 當 PHP 要顯示或記錄錯誤時，它可以把錯誤訊息排版成 HTML，這樣比較好看。
; 這個設定就是用來控制要不要把錯誤訊息轉成 HTML 格式。注意：在 CLI SAPI 環境下，這個設定被硬性規定為 Off。
; https://php.net/html-errors
;html_errors = On
; 如果 html_errors 設為 On，而且 docref_root 不是空的，PHP 就會產生可以點的錯誤訊息，連過去看詳細的錯誤說明或出問題的函式。
; 您可以從 https://php.net/docs 下載 PHP 手冊，然後把 docref_root 改成您本機手冊的網址開頭（最前面要加 '/'）。另外也要寫明用的檔案副檔名，包括前面的點。
; PHP 預設是留空，這樣就不會產生文件連結。注意：千萬不要在正式環境用這個功能。
; https://php.net/docref-root
; 範例
;docref_root = "/phpmanual/"
; https://php.net/docref-ext
;docref_ext = .html
; 要在錯誤訊息前面輸出的字串。PHP 預設是留空。
; https://php.net/error-prepend-string
; 範例：
;error_prepend_string = "<span style='color: #ff0000'>"
; 要在錯誤訊息後面輸出的字串。PHP 預設是留空。
; https://php.net/error-append-string
; 範例：
;error_append_string = "</span>"
; 把錯誤寫進指定的 log 檔。PHP 預設是留空。
; https://php.net/error-log
; 範例：
;error_log = php_errors.log
; 把錯誤紀錄（log）送到 syslog（在 Windows 系統上叫 Event Log）。
;error_log = syslog
; syslog ident 是指加在每條 syslog 訊息最前面的識別字串。只有在 error_log 設定成 syslog 時才會用到。
;syslog.ident = php
; syslog facility 是用來指定「是哪種類型的程式」在紀錄這條訊息。一樣只有在 error_log 設定成 syslog 時才會生效。
;syslog.facility = user
; 這個設定可以拿來關閉控制字元的過濾功能（預設就是關閉的）。有些紀錄器（logger）只接受 NVT-ASCII，有些則是只要不是控制字元都收。
; 如果您的 logger 什麼格式都支援，那就完全不需要過濾。可以設定的值有：
;          ascii（所有可印出的 ASCII 字元加上換行符號 NL）
;          no-ctrl（除了控制字元以外的所有字元）
;          all（所有字元）
;          raw（跟 "all" 一樣，但訊息遇到換行時不會被拆開）。
; 詳情參考 https://php.net/syslog.filter
;syslog.filter = ascii
; windows.show_crt_warning
; 預設值：0
; 開發環境建議值：0
; 正式上線環境建議值：0
;;;;;;;;;;;;;;;;;; 資料處理（Data Handling）；
;;;;;;;;;;;;;;;;;
; 這個是用在 PHP 自動產生的 URL 裡面，用來分隔參數的分隔符號。PHP 預設是 "&"。
; 詳情參考 https://php.net/arg-separator.output
; 範例：
;arg_separator.output = "&amp;"
; 這是 PHP 解析傳入的 URL 時，用來把參數拆成變數的分隔符號清單。PHP 預設是 "&"。
; 注意：這個 directive 裡的每一個字元，都會被單獨當成分隔符號來用！
; 詳情參考 https://php.net/arg-separator.input
; 範例：
;arg_separator.input = ";&"
; 這個設定決定了 PHP 啟動時要註冊哪些超全域陣列（super global arrays）。G、P、C、E、S 分別代表 GET、POST、COOKIE、ENV 和 SERVER。
; 註冊這些陣列會消耗一點效能，加上 ENV 其實沒有其他幾個那麼常用，所以不建議在正式環境上啟用 ENV。如果真的需要拿環境變數，改用 getenv() 抓就可以了。
; 預設值："EGPCS"
; 開發環境建議值："GPCS"
; 正式上線環境建議值："GPCS"
; 詳情參考 https://php.net/variables-order
variables_order = "GPCS"
; 這個設定決定哪些超全域資料（G、P、C）要塞進 REQUEST 這個超全域陣列裡，同時也決定資料塞進去時覆蓋的順序。
; 這裡的設定方式跟 variables_order 幾乎一模一樣，只有一個地方不同：如果把這裡留空，PHP 會直接套用 variables_order 的設定，不代表 REQUEST 陣列就會是空的。
;  預設值：None
;  開發環境建議值："GP"
;  正式上線環境建議值："GP"
;  詳情參考 https://php.net/request-order
request_order = "GP"
; 這個設定決定 PHP每次執行時，要不要自動產生 $argv 和 $argc 這兩個變數。$argv 包含執行腳本時傳進來的所有參數陣列，$argc 則是參數的總數量整數。
; 這兩個變數在跑 CLI 命令行腳本時非常好用。不過如果開啟這個功能，每次執行腳本都會多耗費 CPU 和記憶體來註冊變數。為了效能著想，正式環境最好把它關掉。
; 注意：在 CLI 模式（CLI SAPI）下，這個設定被寫死永遠是 On。
; 預設值：On
; 開發環境建議值：Off
; 正式上線環境建議值：Off
; 詳情參考 https://php.net/register-argc-argv
register_argc_argv = Off
; 開啟這個功能的話，ENV、REQUEST 和 SERVER 這幾個變數就不會在腳本一啟動時就建立，而是等到程式真的用到時才建立（即時處理 / Just In Time）。
; 如果您的腳本根本沒用到這些變數，開著這項設定就能提升效能。另外，必須把 register_argc_argv 關掉，這個設定才會生效。
; 詳情參考 https://php.net/auto-globals-jit
auto_globals_jit = On
; 控制 PHP 要不要讀取 POST 資料。這個選項預設是開啟的，您大概不會想在全域把這關掉。
; 要是關了，$_POST 跟 $_FILES 就永遠是空的，您唯一的讀法就只能透過 php://input 資料流。這在做代理請求或想省記憶體來處理 POST 資料時會滿好用的。
; https://php.net/enable-post-data-reading
;enable_post_data_reading = Off
; PHP 能接收的 POST 資料大小上限。設成 0 代表不限制。如果 enable_post_data_reading 被關掉的話，這個設定就會被忽略。
; https://php.net/post-max-size
post_max_size = 8M
; 在執行 PHP 主要檔案之前，自動引入指定的檔案。 
; https://php.net/auto-prepend-file
auto_prepend_file =
; 在執行完 PHP 主要檔案之後，自動引入指定的檔案。 
; https://php.net/auto-append-file
auto_append_file =
; 預設情況下，PHP 會帶 Content-Type 標頭來輸出媒體類型。如果您不想讓它自動帶，直接清空就好。

; PHP 內建預設的媒體類型是 text/html。
; https://php.net/default-mimetype
default_mimetype = "text/html"
; PHP 預設的字元集是 UTF-8。 
; https://php.net/default-charset
default_charset = "UTF-8"
; PHP 內部的字元編碼預設是空的。留空的話，就會直接用 default_charset 的設定。
; https://php.net/internal-encoding
;internal_encoding =
; PHP 輸入的字元編碼預設是空的。留空的話，就會直接用 default_charset 的設定。
; https://php.net/input-encoding
;input_encoding =
; PHP 輸出的字元編碼預設是空的。留空的話，就會直接用 default_charset 的設定。有需要也可以看一下 output_buffer。
; https://php.net/output-encoding
;output_encoding =
;;;;;;;;;;;;;;;;;;;;;;;;;; 路徑與目錄設定 ;
;;;;;;;;;;;;;;;;;;;;;;;;;
; UNIX 系統格式："/path1:/path2"
;include_path = ".:/php/includes"
; Windows 的寫法是："\path1;\path2"
;include_path = ".;c:\php\includes"
; PHP 的 include_path 預設值是 ".;/path/to/php/pear"
; 詳情可以看 https://php.net/include-path

; 這是存放 PHP 網頁的根目錄，有設定才會生效。
; 如果您的 PHP 編譯時沒有加上 FORCE_REDIRECT，而且您又是在 IIS 以外的 Web 伺服器上把 PHP 當作 CGI 來跑，那就一定要設定 doc_root，安全相關細節可以看官方文件。
; 另一個做法是用下面提到的 cgi.force_redirect 設定。
; 詳情參考 https://php.net/doc-root
doc_root =
; 這個目錄是用來讓 PHP 透過 /~username 這種路徑去開啟網頁腳本用的，有設定才會生效。
; 詳情參考 https://php.net/user-dir
user_dir =
; 這是用來放外掛擴充套件（模組）的目錄。
; 詳情參考 https://php.net/extension-dir
;extension_dir = "./"
; 在 Windows 底下：
extension_dir = "D:\Robot_Program\php82\ext"
; 存放暫存檔的目錄，沒設定的話預設會直接用系統預設值（可以參考 sys_get_temp_dir）
;sys_temp_dir = "/tmp"
; 控制要不要啟用 dl() 這個函數。dl() 在 IIS 或 Zeus 這類多執行緒的伺服器上運作會有問題，所以系統會在這些環境下自動停用它。
; 詳情參考 https://php.net/enable-dl
enable_dl = Off
; 在大多數 Web 伺服器下用 CGI 模式跑 PHP 時，一定要開 cgi.force_redirect 來確保安全。
; 如果不設定，PHP 預設是開啟的。您可以在這裡把它關掉，但風險要自己負擔。**不過如果是 IIS，您完全可以放心地把它關掉，而且實際上也是必須關掉。
; 詳情參考 https://php.net/cgi.force-redirect
;cgi.force_redirect = 1
; 如果開啟 cgi.nph，會強制 CGI 每次處理請求時都傳送 Status: 200。PHP 預設是關閉這個功能的。
;cgi.nph = 1
; 如果開了 cgi.force_redirect，但您用的不是 Apache 或 Netscape (iPlanet) 伺服器，可能需要設定一個環境變數名稱，讓 PHP 檢查這個變數來確定可以繼續執行。
; 設定這個變數可能會帶來安全疑慮，請先搞清楚原理再改。
; 詳情參考 https://php.net/cgi.redirect-status-env
;cgi.redirect_status_env =
; cgi.fix_pathinfo 提供了對 CGI *真實* PATH_INFO/PATH_TRANSLATED 的支援。
; PHP 以前的做法是把 PATH_TRANSLATED 直接設成 SCRIPT_FILENAME，而且無法判讀 PATH_INFO 是什麼。
; 想了解更多 PATH_INFO 細節可以看 CGI 規範。設成 1 的話，PHP CGI 會修正路徑以符合規範；設成 0 則是維持舊有運作方式。
; 預設是 1。建議您把程式碼改掉，改用 SCRIPT_FILENAME 而不是 PATH_TRANSLATED。
; 詳情參考 https://php.net/cgi.fix-pathinfo
;cgi.fix_pathinfo=1
; 只要開啟 cgi.discard_path，您就可以把 PHP CGI 的執行檔放心地放在網頁主目錄外面，這樣別人就沒辦法繞過 .htaccess 的安全機制了。
;cgi.discard_path=1
; IIS 環境下的 FastCGI 可以類比（模擬）發起請求的用戶端安全權限，這讓 IIS 能夠直接設定請求要在哪個安全架構下執行。
; 不過 Apache 的 mod_fastcgi 目前還不支援這個功能（截至 2002/03/17）。如果您是在 IIS 底下跑就改編成 1，預設是 0。
; 詳情參考 https://php.net/fastcgi.impersonate
;fastcgi.impersonate = 1
; 關閉透過 FastCGI 連線上記錄 Log 的功能。PHP 預設是會把這個功能開啟的。
;fastcgi.logging = 0
; cgi.rfc2616_headers 這個設定是用來告訴 PHP，在回傳 HTTP 狀態碼時要用哪一種 Header 格式。
; 設成 0 的話，PHP 會發送 Apache 支援的 Status: Header；如果設成 1，PHP 就會發送符合 RFC2616 標準的 Header。預設值是 0。
; 詳情參考 https://php.net/cgi.rfc2616-headers
;cgi.rfc2616_headers = 0
; cgi.check_shebang_line 是用來控制 CGI 模式下的 PHP，要不要去檢查檔案第一行是不是 #! 開頭（也就是 shebang）。
; 如果您的 script 既要能單獨執行，又要能透過 PHP CGI 跑，可能就會需要這一行。只要開啟這個設定，PHP 在 CGI 模式下就會直接跳過第一行並忽略裡面的內容。
; 詳情參考 https://php.net/cgi.check-shebang-line
;cgi.check_shebang_line=1
;;;;;;;;;;;;;;;;; 檔案上傳設定；
;;;;;;;;;;;;;;;;
; 要不要開放透過 HTTP 上傳檔案。
; 詳情參考 https://php.net/file-uploads
file_uploads = On
; 透過 HTTP 上傳檔案時用的暫存目錄（如果沒設定，就會直接用系統預設的）。
; 詳情參考 https://php.net/upload-tmp-dir
;upload_tmp_dir =
; 允許上傳檔案的最大容量限制。
; 詳情參考 https://php.net/upload-max-filesize
upload_max_filesize = 20M
; 單一次請求裡面，最多允許同時上傳幾個檔案。
max_file_uploads = 20
;;;;;;;;;;;;;;;;;;; Fopen 包裝函式設定；
;;;;;;;;;;;;;;;;;;
; 要不要允許把 URL（像是 http:// 或 ftp://）直接當成一般檔案來操作。
; 詳情參考 https://php.net/allow-url-fopen
allow_url_fopen = On
; 這裡是用來設定要不要允許 include 或 require 直接把 URL（像是 https:// 或 ftp://）當成檔案開啟。
; 詳情參考 https://php.net/allow-url-include
allow_url_include = Off
; 這張用來設定匿名 ftp 的密碼（通常是您的 Email）。PHP 預設是留空。
; 詳情參考 https://php.net/from
;from="john@doe.com"
; 設定 User-Agent 字串。PHP 預設是留空。
; 詳情參考 https://php.net/user-agent
;user_agent="PHP"
; 這是基於 socket 的串流預設逾時時間（單位是秒）。
; 詳情參考 https://php.net/default-socket-timeout
default_socket_timeout = 60
; 如果您的程式需要處理來自 Mac 系統的檔案，或者您本身是用 Mac 但要處理來自 Unix 或 Win32 的檔案，開啟這個設定後，PHP 就會自動偵測那些檔案的 EOL 換行字元。
; 這樣不管檔案是哪裡來的，fgets() 和 file() 都可以正常運作。
; 詳情參考 https://php.net/auto-detect-line-endings
;auto_detect_line_endings = Off
;;;;;;;;;;;;;;;;;;;;;;; 動態擴充模組（Dynamic Extensions）;
;;;;;;;;;;;;;;;;;;;;;;
; 如果您希望自動載入某個擴充模組，可以用下面的語法：
;   extension=modulename; 舉例來說：
;   extension=mysqli
; 如果要載入的擴充模組庫不在預設的擴充模組目錄裡，您可以直接指定模組檔案的絕對路徑：
;   extension=/path/to/extension/mysqli.so
; 注意：舊版 PHP 用的語法（'extension=<ext>.so' 和 'extension='php_<ext>.dll'）雖然現在還支援，但那是為了相容舊程式，未來 PHP 大改版時可能會廢棄。
; 所以可以的話，請盡量改用新的 ('extension=<ext>) 語法。

; Windows 環境注意事項：
; 很多 DLL 檔都會放在 ext/ 擴充模組資料夾裡，或是獨立下載的 PECL DLL 裡面。請務必確認 extension_dir 這個設定值的路徑有設對。

;extension=bz2
; 如果您是用 OpenSSL 1.0.2 跟 OpenLDAP，ldap 擴充功能必須排在 curl 前面載入。
; 不然使用 SASL 之後卸載，會直接爆掉（segfault）。詳細資訊可以看 https://github.com/php/php-src/issues/8620
extension=ldapextension=curl;extension=ffiextension=ftpextension=fileinfoextension=gdextension=gettextextension=gmpextension=intlextension=imapextension=mbstring;extension=exif                     ; 必須置於 mbstring 之後，因為它依賴於 mbstringextension=mysqli;extension=oci8_12c           ; 與 Oracle Database 12c Instant Client 搭配使用;extension=oci8_19             ; 與 Oracle Database 19 Instant Client 搭配使用;extension=odbcextension=openssl;extension=pdo_firebirdextension=pdo_mysql;extension=pdo_oci;extension=pdo_odbc;extension=pdo_pgsqlextension=pdo_sqlite;extension=pgsql;extension=shmop; 一定要安裝 PHP 包裡面附的 MIBS 資料。說明可以參考
; https://www.php.net/manual/en/snmp.installation.php。
;extension=snmp;extension=soap;extension=sockets;extension=sodiumextension=sqlite3;extension=tidy;extension=xslextension=zip
; 如果有 zend_extension 這個變數，ioncube 設定一定要放在第一個 
zend_extension = "D:/Robot_Program/ioncube/ioncube_loader_win_8.2.dll"zend_extension=opcache
;;;;;;;;;;;;;;;;;;;; 模組設定 ;
;;;;;;;;;;;;;;;;;;;
[CLI Server]; 控制 CLI 內建伺服器在終端機輸出時，要不要套用 ANSI 顏色標示。
cli_server.color = On
[Date]; 設定日期相關函數預設要用哪個時區，參考 https://php.net/date.timezone。
;date.timezone =
; https://php.net/date.default-latitude
;date.default_latitude = 31.7667
; https://php.net/date.default-longitude
;date.default_longitude = 35.2333
; https://php.net/date.sunrise-zenith
;date.sunrise_zenith = 90.833333
; https://php.net/date.sunset-zenith
;date.sunset_zenith = 90.833333
[filter]
; https://php.net/filter.default
;filter.default = unsafe_raw
; https://php.net/filter.default-flags
;filter.default_flags =
[iconv]; 這個 INI 設定已經廢棄了，請改用全域的 input_encoding。如果留空的話，系統會拿 default_charset、input_encoding 或 iconv.input_encoding 來用。
; 優先順序是：default_charset < input_encoding < iconv.input_encoding
;iconv.input_encoding =
; 這個 INI 設定已經廢棄了，建議改用全域的 internal_encoding。如果留空的話，系統會拿 default_charset、internal_encoding 或; iconv.internal_encoding來用。
; 它們的優先順序是：iconv.internal_encoding < internal_encoding < default_charset 
;iconv.internal_encoding =
; 這個 INI 設定已經廢棄了，請改用全域的 output_encoding。如果留空，系統會拿 default_charset、output_encoding 或 iconv.output_encoding來用。
; 優先順序是：default_charset < output_encoding < iconv.output_encoding。
; 另外，如果要用輸出編碼轉換功能，一定要先設定好 iconv 的 output handler，不然會轉不成功。
;iconv.output_encoding =
[imap]; 預設會停用 rsh/ssh 登入。如果您想啟動這個功能，可以透過這個 INI 設定來開啟。
; 不過要注意的是，IMAP 函式庫在把信箱名稱帶進 rsh/ssh 指令前是不會先過濾的，所以開啟 rsh/ssh 後，如果把不可信的資料傳給這個函式，會很不安全。
;imap.enable_insecure_rsh=0
[intl];intl.default_locale =
; 這個設定可以讓您決定當 intl 函式裡面出錯時，要觸發什麼等級的 PHP 錯誤。填入的值就是錯誤等級。預設是 0，代表不會產生任何錯誤。
;intl.error_level = E_WARNING
;intl.use_exceptions = 0
[sqlite3]; 這是指定 SQLite3 擴充套件目錄的地方
; 詳情參考 https://php.net/sqlite3.extension-dir
;sqlite3.extension_dir =
; 這是 SQLite 的防禦模式開關（只限 SQLite 3.26 以上的版本）。開啟之後，那些可能會讓一般 SQL 語法故意損毀資料庫檔案的功能就會被停用。
; 像是直接寫入 schema、影子表（例如 FTS 資料表）或是 sqlite_dbpage 虛擬表都會被禁止。
; 詳情可以看：https://www.sqlite.org/c3ref/c_dbconfig_defensive.html（如果是舊版的 SQLite，這個開關完全沒作用）。
;sqlite3.defensive = 1
[Pcre]; 這是 PCRE 函式庫的回溯次數限制（backtracking limit）。
; 詳情參考 https://php.net/pcre.backtrack-limit
;pcre.backtrack_limit=100000
; 這是 PCRE 函式庫的遞迴次數限制。要注意的是，如果您把這個值設太高，有可能會吃光整個程序可用的 stack 空間，最後因為撞到作業系統的 stack上限而導致 PHP 當掉。
; 詳情參考 https://php.net/pcre.recursion-limit
;pcre.recursion_limit=100000
; 用來開啟或關閉正規表示式樣式的 JIT 編譯功能。要用這個功能的話，PCRE 函式庫在當初編譯時就必須要支援 JIT。
;pcre.jit=1
[Pdo]; 用來設定要不要啟用 ODBC 連線池（connection pooling）。選項有 "strict"、"relaxed" 跟 "off" 這三種。
; 詳情參考 https://php.net/pdo-odbc.connection-pooling
;pdo_odbc.connection_pooling=strict
[Pdo_mysql]; 這是本機 MySQL 連線預設用的 socket 名稱。如果留空的話，就會直接套用 MySQL 內建的預設值。
pdo_mysql.default_socket=
[Phar]; https://php.net/phar.readonly
;phar.readonly = On
; https://php.net/phar.require-hash
;phar.require_hash = On
;phar.cache_list =
[mail function]; 這只有 Win32 環境才有用。https://php.net/smtp
SMTP = localhost
; https://php.net/smtp-port
smtp_port = 25
; 這只有 Win32 環境才有用。https://php.net/sendmail-from
;sendmail_from = me@example.com
; 這只有 Unix 環境才有用。您也可以順便帶參數進去（預設是 "sendmail -t -i"）。https://php.net/sendmail-path
;sendmail_path =
; 強制把指定的參數當成額外參數傳給 sendmail 執行檔。這些參數永遠會蓋掉 mail() 的第 5 個參數。
;mail.force_extra_parameters =
; 加上 X-PHP-Originating-Script: 標頭，裡面會包含腳本的 uid 跟檔名。
mail.add_x_header = Off
; 混合使用 LF 跟 CRLF 當換行符號，這樣才能相容某些沒照 RFC 2822 規範走的 MTA。
mail.mixed_lf_and_crlf = Off
; 記錄所有 mail() 呼叫的 log 檔路徑。Log 內容會包含腳本的完整路徑、行號、收件者地址還有 header。
;mail.log =
; 把郵件 log 記錄到 syslog（在 Windows 上就是事件檢視器）。
;mail.log = syslog
[ODBC]; https://php.net/odbc.default-db
;odbc.default_db    =  Not yet implemented
; https://php.net/odbc.default-user
;odbc.default_user  =  Not yet implemented
; https://php.net/odbc.default-pw
;odbc.default_pw    =  Not yet implemented
; 用來控制 ODBC 的游標模式。預設值是 SQL_CURSOR_STATIC（預設）。odbc.default_cursortype
; 用來控制要不要啟用持續性連線（persistent links）。https://php.net/odbc.allow-persistent
odbc.allow_persistent = On
; 在拿舊的持續性連線出來重複使用前，先檢查一下連線是否還正常。https://php.net/odbc.check-persistent
odbc.check_persistent = On
; 設定持續性連線的最大數量限制。設成 -1 代表不設限。https://php.net/odbc.max-persistent
odbc.max_persistent = -1
; 設定總連線數（一般連線加上持續性連線）的最大限制。設成 -1 代表不設限。https://php.net/odbc.max-links
odbc.max_links = -1
; 用來設定 LONG 欄位資料要怎麼處理。這裡填的數字是指要回傳多少 bytes 的資料給變數；如果設成 0 代表直接透傳（passthru）。詳情參考 https://php.net/odbc.defaultlrl
odbc.defaultlrl = 4096
; 控制二進位資料的處理方式。0 代表直接透傳（passthru），1 代表原封不動回傳，2 代表轉成 char。
; 關於 odbc.defaultlrl 和 odbc.defaultbinmode 的詳細說明，可以參考 odbc_binmode 跟 odbc_longreadlen 的官方文件。
; 詳情參考 https://php.net/odbc.defaultbinmode
odbc.defaultbinmode = 1
[MySQLi]; 設定持續性連線的最大數量限制。設成 -1 代表不設限。https://php.net/mysqli.max-persistent
mysqli.max_persistent = -1
; 允許從 PHP 的角度，透過 LOAD DATA 指令來讀取伺服器本機的檔案。https://php.net/mysqli.allow_local_infile
;mysqli.allow_local_infile = On
; 讓您可以指定一個資料夾，規定只有裡面的檔案才能用 LOAD DATA LOCAL 來傳送。不過如果已經開啟了 mysqli.allow_local_infile，這個設定就會被忽略。
;mysqli.local_infile_directory =
; 用來控制要不要啟用持續性連線（persistent links）。https://php.net/mysqli.allow-persistent
mysqli.allow_persistent = On
; 連線數量的上限。設成 -1 代表不設限。 https://php.net/mysqli.max-links
mysqli.max_links = -1
; mysqli_connect() 預設用的 port 號。如果沒設定，mysqli_connect() 會依序去抓 $MYSQL_TCP_PORT、/etc/services 裡面的 mysql-tcp 設定，或是編譯時定義的 MYSQL_PORT。
; 但在 Win32 環境下就只會看 MYSQL_PORT。 https://php.net/mysqli.default-port
mysqli.default_port = 3306
; 本機 MySQL 連線預設用的 socket 名稱。如果留空，就會直接用 MySQL 內建的預設值。
; https://php.net/mysqli.default-socket
mysqli.default_socket =
; mysqli_connect() 預設連線的 host（安全模式下不適用）。 https://php.net/mysqli.default-host
mysqli.default_host =
; mysqli_connect() 預設用的帳號（安全模式下不適用）。 https://php.net/mysqli.default-user
mysqli.default_user =
; mysqli_connect() 預設用的密碼（安全模式下不適用）。要注意的是，把密碼寫在這個檔裡通常是個很糟的做法。
; 只要有權限執行 PHP 的人，都可以直接跑 'echo get_cfg_var("mysqli.default_pw") 把密碼印出來！當然，任何有權限讀取這個檔案的使用者也都看得到密碼。
; 詳情參考 https://php.net/mysqli.default-pw
mysqli.default_pw =
; 如果開啟這個選項，持久性連線在關閉並放回連線池之前，會先把所有還沒提交的交易自動 rollback 掉。
;mysqli.rollback_on_cached_plink = Off
[mysqlnd]
; 開啟或關閉 mysqlnd 收集一般統計資料的功能，這些資料可以拿來調校和監控 MySQL 的運作狀況。
mysqlnd.collect_statistics = On
; 開啟或關閉 mysqlnd 收集記憶體使用量統計的功能，這些資料可以拿來調校和監控 MySQL 的運作狀況。
mysqlnd.collect_memory_statistics = Off
; 把所有透過 mysqlnd 的 extension 通訊紀錄，通通寫到指定的 log 檔裡。 https://php.net/mysqlnd.debug
;mysqlnd.debug =
; 設定有哪些 query 會被記錄到 log 裡面。
;mysqlnd.log_mask = 0
; mysqlnd 記憶體池的預設大小，主要給結果集使用。
;mysqlnd.mempool_default_size = 16000
; 發送指令給 MySQL 時預先分配的緩衝區大小，單位是 bytes。
;mysqlnd.net_cmd_buffer_size = 2048
; 讀取伺服器傳來的資料時預先分配的緩衝區大小，單位是 bytes。
;mysqlnd.net_read_buffer_size = 32768
; 網路請求的逾時時間，單位是秒。
;mysqlnd.net_read_timeout = 31536000
; 跟 SHA-256 驗證外掛有關。這裡要填 MySQL 伺服器 RSA 公鑰的檔案路徑。
;mysqlnd.sha256_server_public_key =
[OCI8]; 連線設定：開啟這個功能可以用外部憑證（OCI_SYSOPER、OCI_SYSDBA）來進行特權連線。https://php.net/oci8.privileged-connect
;oci8.privileged_connect = Off
; 連線設定：每個程序最多可以保持幾個持久性 OCI8 連線。設成 -1 代表不設限。https://php.net/oci8.max-persistent
;oci8.max_persistent = -1
; 連線設定：一個程序最多可以讓閒置的持久連線維持幾秒。設成 -1 代表閒置連線永遠不會斷開。https://php.net/oci8.persistent-timeout
;oci8.persistent_timeout = -1
; 連線設定：執行 oci_pconnect() 時，要過幾秒才會發送 ping 來確認連線是否還正常。設成 0 代表每次 oci_pconnect() 都會 ping 一次；設成 -1 則是完全不 ping。
; 詳情參考 https://php.net/oci8.ping-interval
;oci8.ping_interval = 60
; 連線設定：如果您有開 Oracle 的 DRCP（資料庫常駐連線池），可以自訂一個連線類別名稱套用到所有連線池請求。
; 要使用 DRCP; 的話，執行同一個應用程式的所有 Web 伺服器都要設定成一樣的字串，而且資料庫連線池跟連線字串也都要設定好使用連線池。
;oci8.connection_class =
; 高可用性：設成 On 的話，當資料庫節點出狀況時，PHP 就會收到系統發出的 FAN（快速應用程式通知）事件。不過資料庫那邊也必須先設定好要發送 FAN 事件才行。
;oci8.events = Off
; 效能調校：這個設定用來開啟敘述句快取（statement caching），並設定要快取多少條敘述句。設成 0 就是關閉快取。https://php.net/oci8.statement-cache-size
;oci8.statement_cache_size = 20
; 效能調校：開啟預取資料列功能，並設定執行完敘述句後自動預取預設的資料筆數。https://php.net/oci8.default-prefetch
;oci8.default_prefetch = 100
; 效能微調用的：當查詢撈出 Oracle LOB locator 時，這個設定會決定一次從 Oracle Database 預先抓取多少 LOB
; 資料回來。調大這個值可以減少跟資料庫來回連線的次數，進而提升效能。https://php.net/oci8.prefetch-lob-size
; oci8.prefetch_lob_size = 0
; 這是為了向下相容用的。設成 On 的話，執行 oci_close() 就不會把 oci_connect() 和 oci_new_connect() 建立的連線給關掉。https://php.net/oci8.old-oci-close-semantics
;oci8.old_oci_close_semantics = Off
[PostgreSQL]; 用來控制要不要允許使用持久連線（persistent links）。https://php.net/pgsql.allow-persistent
pgsql.allow_persistent = On
; 只要呼叫 pg_pconnect()，就一定會去檢查持久連線是不是已經斷掉。開啟這個自動重設功能會額外消耗一點點效能。https://php.net/pgsql.auto-reset-persistent
pgsql.auto_reset_persistent = Off
; 持久連線數量的上限。設成 -1 代表不限制。https://php.net/pgsql.max-persistent
pgsql.max_persistent = -1
; 總連線數量的上限（包含一般連線跟持久連線）。設成 -1 代表不限制。https://php.net/pgsql.max-links
pgsql.max_links = -1
; 要不要忽略 PostgreSQL 後端傳來的 Notice 訊息。上記錄 Notice 訊息會花一點點系統資源。https://php.net/pgsql.ignore-notice
pgsql.ignore_notice = 0
; 要不要把 PostgreSQL 後端的 Notice 訊息記進 log 裡。除非把 pgsql.ignore_notice 設成 0，不然模組是沒辦法上記錄 Notice 訊息的。https://php.net/pgsql.log-notice
pgsql.log_notice = 0
[bcmath]; 所有 bcmath 函式預設要保留的小數位數。https://php.net/bcmath.scale
bcmath.scale = 0
[browscap]; https://php.net/browscap
;browscap = extra/browscap.ini
[Session]; 用來存取 session 資料的處理常式（handler）。https://php.net/session.save-handler
session.save_handler = files
; 這是要傳給 save_handler 的參數。如果 handler 是用 files，這裡填的就是存放 session 檔案的路徑。注意：Windows 用戶一定要改這個變數，PHP 的 session 函式才能正常運作。

; 路徑可以像這樣設定：
;     session.save_path = "N;/path"
; 這裡的 N 是一個整數。這樣設定之後，PHP 就不會把所有 session 檔案通通塞在 /path 底下，而是會往下建立 N 層子目錄，把 session 資料分散存放在這些目錄裡。
; 如果您的作業系統在處理「單一目錄放太多檔案」時效性會變差，用這個方法對處理大量 session 的伺服器來說會比較有效率。

; 注意 1：PHP 不會自動幫您建好這些子目錄，您可以用 ext/session 目錄裡面的腳本來產生。注意 2：如果您選擇用子目錄來存 session，記得看一下下面關於 garbage collection（垃圾回收）的說明。

; 檔案儲存模組預設會用 mode 600 來建立檔案，您可以用下面的方式來修改：

;     session.save_path = "N;MODE;/path"
; 這裡的 MODE 是用八進位表示的權限值。要注意的是，這樣設定並不會覆蓋掉程序原本的 umask。https://php.net/session.save-path
;session.save_path = "/tmp"
; 這個用來控制要不要開啟嚴格 session 模式（strict session mode）。
; 開啟後，系統就不會接受還沒初始化的 session ID；如果瀏覽器傳了一個未初始化的 session ID 過來，系統會直接重新產生一個新的。
; 這個模式可以避免應用程式因為 session 採納漏洞（session adoption vulnerability）而遭到 session 固定攻擊（session fixation）。
; 為了保持最大相容性，預設是關閉的，但非常建議把它開啟。https://wiki.php.net/rfc/strict_sessions
session.use_strict_mode = 0
; 設定要不要使用 cookie。https://php.net/session.use-cookies
session.use_cookies = 1
; https://php.net/session.cookie-secure
;session.cookie_secure =
; 開了這個選項之後，PHP 就一定只會透過 cookie 來讀取和維護 session id。如果您沒有自己去處理和管理 session id
; 的話，強烈建議開啟這個設定，因為它對防範 session 劫持（session hijacking）非常有幫助。雖然它不能百分之百完全擋掉
; session 劫持，但至少是個很好的基礎防護。https://php.net/session.use-only-cookies
session.use_only_cookies = 1
; session 的名稱（會直接拿來當作 cookie 的名字）。https://php.net/session.name
session.name = PHPSESSID
; 設定要在收到請求（request）的時候，自動初始化 session。https://php.net/session.auto-start
session.auto_start = 0
; 設定 cookie 的存活時間（單位是秒）。如果設成 0，代表瀏覽器關掉之後 cookie
; 就會失效。https://php.net/session.cookie-lifetime
session.cookie_lifetime = 0
; 設定這個 cookie 在哪個路徑下有效。https://php.net/session.cookie-path
session.cookie_path = /
; 設定這個 cookie 在哪個網域下有效。https://php.net/session.cookie-domain
session.cookie_domain =
; 要不要幫 cookie 加上 httpOnly 標記，加了之後像 JavaScript
; 這類的瀏覽器腳本就存取不到它。https://php.net/session.cookie-httponly
session.cookie_httponly =
; 幫 cookie 加上 SameSite 屬性，用來減輕跨站請求偽造（CSRF/XSRF）的風險。目前可以填的值有 "Strict"、"Lax" 或 "None"。
; 如果填 "None" 的話，記得一定要加引號，因為在 ini 檔裡面如果只寫 `none` 會被當成 `false` 解析。https://tools.ietf.org/html/draft-west-first-party-cookies-07
session.cookie_samesite =
; 用來序列化資料的處理程式。php 是 PHP 預設標準的序列化格式。https://php.net/session.serialize-handler
session.serialize_handler = php
; 設定每次初始化 session 時，觸發垃圾回收（GC）機制的機率。機率是用 gc_probability/gc_divisor 計算出來的，像是; 1/100 就代表每次 request 有 1% 的機率會跑 GC。
;  預設值: 1
;  開發環境建議值: 1
;  正式環境同樣建議設為1 https://php.net/session.gc-probability
session.gc_probability = 1
; 設定每次初始化 session 時，觸發垃圾回收（GC）機制的機率。
; 機率是用 gc_probability/gc_divisor 計算出來的，像是 1/100 就代表每次 request 有 1% 的機率會跑 GC。如果是流量很高的正式環境伺服器，改設成 1000 效能會比較好。
;  預設值: 100
;  開發環境建議值: 1000
;  正式環境同樣建議設為1000
;  https://php.net/session.gc-divisor
session.gc_divisor = 1000
; 存好的資料超過這個秒數之後，就會被當成垃圾，然後被垃圾回收機制清掉。https://php.net/session.gc-maxlifetime
session.gc_maxlifetime = 1440
; 注意：如果您是用子目錄來存 session 檔案（參考上面的 session.save_path），那垃圾回收就*不會*自動執行。您需要自己寫 shell script、設定 cron 機制或用其他方法來做 GC。
; 舉例來說，下面這段指令就相當於把 session.gc_maxlifetime 設成 1440（1440 秒 = 24 分鐘）
; find /path/to/sessions -cmin +24 -type f | xargs rm

; 檢查 HTTP Referer，避免帶有 session id 的網址流到外面被濫用。HTTP_REFERER 必須包含這裡設定的字串，這筆 session 才算有效。https://php.net/session.referer-check
session.referer_check =
; 設定成 {nocache,private,public,} 來控制 HTTP 快取的行為，或是留白不設定，才不會發送防快取的 header。https://php.net/session.cache-limiter
session.cache_limiter = nocache
; 設定文件過期時間，單位是 n 分鐘。https://php.net/session.cache-expire
session.cache_expire = 180
; trans sid 預設是關掉的。開了會影響使用者的安全性，請小心使用。
; 例如：使用者可能會把帶有有效 session ID 的網址寄給別人或貼到聊天室，
; 帶有 session ID 的網址可能會被存在公用電腦或者使用者會一直用瀏覽器歷史紀錄或書籤裡的同一個網址來逛您的網站，導致 session ID 一直不變。
; https://php.net/session.use-trans-sid
session.use_trans_sid = 0
; 設定 session ID 的字元長度。這裡可以填 22 到 256。低於預設值的長度只是為了相容舊版，建議至少要用 32 個字元以上。https://php.net/session.sid-length
;  預設值: 32
;  開發環境建議值: 26
;  正式環境同樣建議設為 26
session.sid_length = 26
; URL rewriter 會去掃指定的那些 HTML 標籤裡面的網址。
; <form> 比較特殊，如果在此處包含 <form>， URL rewriter 它會自動加一個隱藏的 <input> 欄位來帶資料，不然這些資料原本會被塞在網址後面。
; 除非有特別指定，否則 <form> 的 action 屬性網址是不會被修改的。要注意的是，這裡每個設定值都要加上 "="，就算後面沒接資料也一樣。
; 預設值: "a=href,area=href,frame=src,form="; 開發環境建議值: "a=href,area=href,frame=src,form="; 正式環境同樣建議設為 "a=href,area=href,frame=src,form="; https://php.net/url-rewriter.tagssession.trans_sid_tags = "a=href,area=href,frame=src,form="
; URL rewriter 預設不會去動絕對路徑的網址。如果您想讓絕對路徑也能改寫，必須在程式執行時（例如用 ini_set()）指定目標主機。
; <form> 標籤比較特殊。無論 session.trans_sid_tags 設定如何，PHP 都會檢查其 action 屬性中的 URL。; 如果沒設主機，系統就會預設用 HTTP_HOST 當作允許的主機。如果要設多組可以用逗點隔開，像是 php.net,www.php.net,wiki.php.net，切記，中間不能有空格。
;  預設值: "" 
;  開發環境建議值: "" 
;  正式環境同樣建議設為 "" 
;session.trans_sid_hosts=""
; 這裡是用來決定把 Hash 二進位資料轉成看得懂的字串時，每一個字元要佔幾個 bit。可選的值有：
;   4  4（0-9, a-f）
;   5  5（0-9; a-v）
;   6  6（0-9, a-z, A-Z, "-", ","）
;  預設值: 4 
;  開發環境建議值: 5 
; 正式環境同樣建議設為5
; https://php.net/session.hash-bits-per-character
session.sid_bits_per_character = 5
; 要不要在 $_SESSION 裡面記錄檔案上傳進度。
; 預設值: On 
; 開發環境建議設為 On 
; 正式環境同樣建議設為 On 
; https://php.net/session.upload-progress.enabled
;session.upload_progress.enabled = On
; 只要 POST 資料全部讀完（也就是檔案傳完了），就立刻把進度資料清掉。
; 預設值: On 
; 開發環境建議設為 On
; 正式環境同樣建議設為 On
; https://php.net/session.upload-progress.cleanup
;session.upload_progress.cleanup = On
; 放在 $_SESSION 裡面的上傳進度 Key 的前綴字串。
; 預設值: "upload_progress_" 
; 開發環境建議設為 "upload_progress_" 
; 正式環境同樣建議設為 "upload_progress_"
; https://php.net/session.upload-progress.prefix
;session.upload_progress.prefix = "upload_progress_"
; 放在 $_SESSION 裡面（接在前綴後面）用來存上傳進度資料的索引名稱。
; 預設值: "PHP_SESSION_UPLOAD_PROGRESS" 
; 開發環境建議設為 "PHP_SESSION_UPLOAD_PROGRESS" 
; 正式環境同樣建議設為 "PHP_SESSION_UPLOAD_PROGRESS" 
; https://php.net/session.upload-progress.name
;session.upload_progress.name = "PHP_SESSION_UPLOAD_PROGRESS"
; 上傳進度的更新頻率，可以用百分比（針對單一檔案）或是 Bytes 來設。
; 預設值: "1%" 
; 開發環境建議設為 "1%" 
; 正式環境同樣建議設為"1%" 
; https://php.net/session.upload-progress.freq
;session.upload_progress.freq =  "1%"
; 兩次更新之間的最小間隔時間，單位是秒。
; 預設值: 1
; 開發環境建議值: 1
; 正式環境建議值: 1
; https://php.net/session.upload-progress.min-freq
;session.upload_progress.min_freq = "1"
; 只有在 Session 資料有變更時才會寫入。預設是開啟的。
; https://php.net/session.lazy-write
;session.lazy_write = On
[Assertion]; 設定要不要把斷言（assertion）編譯進去（完全不編譯的話程式執行時就不會有額外開銷）。
; -1 是完全不編譯
; 0 是執行時直接跳過斷言
; 1 是正常執行斷言
; 如果要切換成負數或從負數改掉，只能在 php.ini 裡面改！（如果 zend.assertions = 1，想在執行時控制開關請參考 assert.active）
; 預設值: 1
; 開發環境建議值: 1
; 正式環境建議值: -1
; https://php.net/zend.assertions
zend.assertions = -1
; 控制 Assert(expr); 要不要生效，預設是開啟的。 https://php.net/assert.active
;assert.active = On
; 當斷言失敗時，直接拋出 AssertionError 異常。 https://php.net/assert.exception
;assert.exception = On
; 當斷言失敗時跳出 PHP 警告。（如果 assert.exception 有開啟的話，會以 exception 為主，忽略這個設定）
; https://php.net/assert.warning
;assert.warning = On
; 當斷言失敗時預設不會直接中斷程式。 https://php.net/assert.bail
;assert.bail = Off
; 當斷言失敗時要呼叫的自訂函式。 https://php.net/assert.callback
;assert.callback = 0
[COM]; 指定檔案路徑，裡面包含 TypeLibs 的 GUID、IID 或檔名。 https://php.net/com.typelib-file
;com.typelib_file =
; 允許進行跨機器的分散式 COM（Distributed-COM）呼叫。 https://php.net/com.allow-dcom
;com.allow_dcom = true
; 執行 com_load() 時，自動註冊元件 TypeLib 裡的常數。 https://php.net/com.autoregister-typelib
;com.autoregister_typelib = true
; 註冊常數時要區分大小寫。 https://php.net/com.autoregister-casesensitive
;com.autoregister_casesensitive = false
; 如果有重複註冊常數的情況，就會顯示警告。 https://php.net/com.autoregister-verbose
;com.autoregister_verbose = true
; 跟 COM 物件互相傳遞字串時要用的預設字元集碼頁（code-page）。預設值是系統的 ANSI 碼頁。
;com.code_page=
; 要使用的 .NET framework 版本。這個設定值的格式是版本號的前三段，中間用點隔開，開頭再加上 "v"，例如 "v4.0.30319"。
;com.dotnet_version=
[mbstring]; 內部字元處理用的語言設定。這會影響到 mb_send_mail() 和 mbstring.detect_order。
; https://php.net/mbstring.language
;mbstring.language = Japanese
; 這個 INI 設定已經廢棄了，請改用全域的 internal_encoding。這是用來設定內部或腳本的編碼。有些編碼沒辦法拿來當作內部編碼（像是 SJIS、BIG5、ISO-2022-*）。
; 如果留空的話，就會依照 default_charset、internal_encoding 或 iconv.internal_encoding 的順序去抓。
; 優先順序是：default_charset < internal_encoding < iconv.internal_encoding
;mbstring.internal_encoding =
; 這個 INI 設定已經廢棄了，請改用全域的 input_encoding。這是用來設定 HTTP 輸入的編碼。
; 若要使用此設置，需將 mbstring.encoding_translation 設為 On; 如果留空的話，就會依照 default_charset、input_encoding 或 mbstring.input 的順序去抓。
; 優先順序是：default_charset < input_encoding < mbstring.http_input
; https://php.net/mbstring.http-input
;mbstring.http_input =
; 這個 INI 設定已經廢棄了，請改用全域的 output_encoding。這是用來設定 HTTP 輸出的編碼。
; 要發揮作用的話，必須把 mb_output_handler 註冊成輸出緩衝區。如果留空，就會依照 default_charset、output_encoding 或 mbstring.http_output 的順序去抓。
; 優先順序是：default_charset < output_encoding < mbstring.http_output。要使用輸出編碼轉換功能，一定要設定好 mbstring 的 output handler，不然轉換會沒辦法執行。
; https://php.net/mbstring.http-output
;mbstring.http_output =
; 開啟這個設定，就會根據 mbstring.internal_encoding 的設定自動轉換編碼。只要設成 On，輸入的字元就會自動轉成內部編碼。
; 注意：如果是要給跨平台或通用性高的函式庫/應用程式使用，請「不要」開啟這個自動轉碼功能。
; https://php.net/mbstring.encoding-translation
;mbstring.encoding_translation = Off
; 這是自動偵測編碼的順序。如果設成 "auto"，偵測順序會根據 mbstring.language 的設定而改變。
; https://php.net/mbstring.detect-order
;mbstring.detect_order = auto
; 當字元沒辦法互相轉碼時，要拿來替換的字元（substitute_character）。
; https://php.net/mbstring.substitute-character
;mbstring.substitute_character = none
; 開啟嚴格的編碼偵測模式。
;mbstring.strict_detection = Off
; 這個設定是拿來指定內容類型（content type）的正則圖案，只要符合的就會觸發 mb_output_handler()。
; 預設值是 mbstring.http_output_conv_mimetypes=^(text/|application/xhtml\+xml)。
;mbstring.http_output_conv_mimetypes=
; 這個設定是拿來限制 mbstring 正則圖案的最大堆疊深度，作用就跟 PCRE 的 pcre.recursion_limit 差不多。
;mbstring.regex_stack_limit=100000
; 這個設定是拿來限制 mbstring 正則圖案的最大重試次數，作用就跟 PCRE 的 pcre.backtrack_limit 差不多。
;mbstring.regex_retry_limit=1000000
[gd]; 讓 JPEG 解碼器忽略警告，硬是把 GD 圖片做出來。預設關閉的警告之後會改用 Notice 方式顯示。https://php.net/gd.jpeg-ignore-warning
;gd.jpeg_ignore_warning = 1
[exif]; Exif 的 UNICODE 使用者留言預設會當成 UCS-2BE/UCS-2LE 處理，JIS 則是當成 JIS。如果有開啟 mbstring 支援，系統就會自動把它轉成對應 encode 設定的編碼。
; 如果沒設定，就會直接抓 mbstring.internal_encoding。至於 decode 設定的部分，有分 Motorola 跟 Intel 的位元組順序，而且 decode 設定不能留空。
; https://php.net/exif.encode-unicode
;exif.encode_unicode = ISO-8859-15
; https://php.net/exif.decode-unicode-motorola
;exif.decode_unicode_motorola = UCS-2BE
; https://php.net/exif.decode-unicode-intel
;exif.decode_unicode_intel    = UCS-2LE
; https://php.net/exif.encode-jis
;exif.encode_jis =
; https://php.net/exif.decode-jis-motorola
;exif.decode_jis_motorola = JIS
; https://php.net/exif.decode-jis-intel
;exif.decode_jis_intel    = JIS
[Tidy]; 使用 tidy 時預設要套用的設定檔路徑。https://php.net/tidy.default-config
;tidy.default_config = /usr/local/lib/php/default.tcfg
; 要不要讓 tidy 自動清理跟修復輸出的內容？警告：如果您會產生像動態圖片這種非 HTML 的內容，千萬不要開啟這個選項。
; https://php.net/tidy.clean-output
tidy.clean_output = Off
[soap]; 用來開啟或關閉 WSDL 快取功能。 https://php.net/soap.wsdl-cache-enabled
soap.wsdl_cache_enabled=1
; 設定 SOAP 擴充套件要存放快取檔案的資料夾名稱。 https://php.net/soap.wsdl-cache-dir
soap.wsdl_cache_dir="/tmp"
; 快取存活時間（ttl）。設定快取檔可以替代原始檔案使用的秒數。 https://php.net/soap.wsdl-cache-ttl
soap.wsdl_cache_ttl=86400
; 設定快取的上限大小。（也就是最多能快取幾個 WSDL 檔案）
soap.wsdl_cache_limit = 5
[sysvshm]; 共用記憶體區塊的預設大小
;sysvshm.init_mem = 10000
[ldap]; 設定最多可以同時開啟多少個連線，填 -1 代表不限制。
ldap.max_links = -1
[dba];dba.default_handler=
[opcache]; 決定要不要啟用 Zend OPCache
opcache.enable=1
; 決定要不要在 CLI 版本的 PHP 啟用 Zend OPCache
opcache.enable_cli=1
; OPcache 使用的共用記憶體大小。
;opcache.memory_consumption=128
; 用來存放 interned strings 的記憶體容量（單位是 Mbytes）。
;opcache.interned_strings_buffer=8
; OPcache Hash Table 最多可以放多少個 key（指令碼）。設定值只能介於 200 到 1000000 之間。
;opcache.max_accelerated_files=10000
; 「浪費掉的」記憶體最高可以到多少比例，超過就會安排重啟。
;opcache.max_wasted_percentage=5
; 這個設定開起來的話，OPcache 會把目前的執行目錄加到腳本的路徑 key 裡面，這樣檔名一樣的檔案就不會撞名。如果關掉效能會好一點，但可能會讓現有的應用程式出問題。
;opcache.use_cwd=1
; 如果關掉的話，檔案系統有變更時，您就必須自己手動重置 OPcache，或是重重啟 webserver 才會生效。
;opcache.validate_timestamps=1
; 每隔幾秒要檢查一次檔案的時間戳記，看看共享記憶體裡的快取有沒有變動。（設為 "1" 代表每秒檢查一次，但同一個 request 只會查一次；設為 "0" 代表每次都會檢查）
;opcache.revalidate_freq=2
; 用來開關在 include_path 裡找檔案的優化功能。
;opcache.revalidate_path=0
; 如果關掉，程式碼裡面所有的 PHPDoc 註解都會被拿掉，這樣可以縮減優化後的程式碼體積。
;opcache.save_comments=1
; 這個開起來的話，每次載入檔案時，編譯階段的警告（包含 notice 和
; deprecation）都會被記錄下來並重新跳出。如果關掉，警告就只會在檔案第一次被快取時出現。
;opcache.record_warnings=0
; 允許覆寫檔案是否存在（例如 file_exists 等等）的效能優化功能。
;opcache.enable_file_override=0
; 這是一個位元遮罩，裡面的每一個位元用來控制是否要啟用對應的 OPcache 優化步驟。
;opcache.optimization_level=0x7FFFBFFF
;opcache.dups_fix=0
; 這裡是設定 OPcache 黑名單檔案的位置（可以用萬用字元）。黑名單是一個純文字檔，裡面列出哪些檔案不需要被快取加速。格式很簡單，一行放一個檔名就好。
; 檔名可以是完整路徑，也可以只寫前綴（像是寫 /var/www/x，就會把 /var/www 底下所有 x 開頭的檔案跟目錄通通設為黑名單）。開頭是 ; 的那行會被當成註解 Ignore。
;opcache.blacklist_filename=
; 可以設定忽略大檔案不去做快取。預設的話是所有檔案都會快取。
;opcache.max_file_size=0
; 每經過 N 次 request，就檢查一次快取的 checksum。預設是 "0"，代表不檢查。
;opcache.consistency_checks=0
; 當快取都沒有人存取時，要等待幾秒才開始執行預定的重啟。
;opcache.force_restart_timeout=180
; OPcache 的錯誤日誌檔名。如果留白的話，預設就會輸出到 stderr。
;opcache.error_log=
; OPcache 所有的錯誤訊息都會記錄到 Web 伺服器的日誌裡。預設只會記錄致命錯誤（level 0）或一般錯誤（level 1）。
; 您也可以調整設定來記錄警告（level 2）、一般資訊（level 3）或是偵錯訊息（level 4）。
;opcache.log_verbosity_level=1
; 偏好的共享記憶體後端機制。直接留白讓系統自己決定就好。
;opcache.preferred_memory_model=
; 防止腳本在執行的時候，意外寫入或改到共享記憶體的資料。這通常只有在做內部除錯時才會用到。
;opcache.protect_memory=0
; 限制只有特定路徑開頭的 PHP 腳本，才能呼叫 OPcache 的 API 函數。預設是 ""，代表完全不限制。
;opcache.restrict_api=
; 共享記憶體區段的對映基準位址（這個只適用於 Windows）。所有的 PHP 程序都必須把共享記憶體對映到同一個位址空間。
; 如果遇到 "Unable to reattach to base address" 這種錯誤，可以用這個設定來手動修復。
;opcache.mmap_base=
; 讓同一個使用者可以開多個 OPcache 實例（這個只適用於 Windows）。只要 PHP 程序的快取 ID 和使用者相同，就會共享同一個 OPcache 實例。
;opcache.cache_id=
; 開啟並設定第二層快取的資料夾。當 SHM 記憶體滿了、伺服器重啟或 SHM 重置時，這能幫忙提升效能。預設是 ""，代表不使用檔案型快取。
;opcache.file_cache=
; 開啓或關閉共享記憶體裡的 opcode 快取功能。
;opcache.file_cache_only=0
; 開啟或關閉從檔案快取載入腳本時的檢查碼（checksum）驗證。
;opcache.file_cache_consistency_checks=1
; 當某個程序無法重新連結到共享記憶體時，會自動針對該程序套用 opcache.file_cache_only=1（這個只適用於 Windows）。前提是您必須先手動開啟檔案快取功能。
;opcache.file_cache_fallback=1
; 開啟或關閉把 PHP 程式碼（text segment）複製到 HUGE PAGES 的功能。
; 在特定條件下（例如只啟動一個主 PHP 程序，其他程序都是從它 fork 出來的），這樣可以減少 TLB miss，稍微提升一點效能。
; 但另一方面，這會拖慢 PHP 啟動速度、增加記憶體用量，而且在記憶體不夠時反而会让效能變差，請小心使用。另外系統作業系統也需要做對應的配置。
;opcache.huge_code_pages=0
; 檢查快取檔案的權限對不對。
;opcache.validate_permission=0
; 避免在 chroot 環境下發生檔名或名稱撞到的情況。
;opcache.validate_root=0
; 如果有設定這個，它會輸出 opcode 的 dump 檔，方便您除錯不同階段的效能最佳化。
;opcache.opt_debug_level=0
; 指定一個 PHP 腳本，讓伺服器啟動時就先編譯並執行它。https://php.net/opcache.preload
;opcache.preload=
; 出於安全考量，系統不允許用 root 權限預先載入程式碼。這個設定可以讓您指定換成別的使用者來執行預先載入。https://php.net/opcache.preload_user
;opcache.preload_user=
; 最後修改時間距離現在不到這個秒數的檔案，先不要快取。這是為了防止快取出更新到一半、還沒寫完的檔案。
; 如果您網站上的檔案更新都是原子性操作（一次到位），可以 設成 "0" 來提升效能。
;opcache.file_update_protection=2
; 用來存放共享 lockfile 的絕對路徑（只限 *nix 系統）。
;opcache.lockfile_path=/tmp
[curl]; CURLOPT_CAINFO 選項的預設值，這裡一定要填絕對路徑。
;curl.cainfo =
[openssl]; 本機檔案系統上的 CA 憑證檔位置，用來驗證 SSL/TLS 對端的身份。
; 大部分人不需要設這個，因為沒設的話 PHP 會自動去抓作業系統管理的憑證庫。
; 就算這裡有設，之後還是能在每個串流裡透過 "cafile" 這個 SSL stream context 選項來覆蓋掉。
;openssl.cafile=
; 如果沒設 openssl.cafile 或找不到 CA 檔案，PHP 就會去 openssl.capath 指定的資料夾找合適的憑證。
; 這個資料夾裡面的憑證檔必須做好正確的雜湊命名。大部分人不需要設這個，因為沒設的話 PHP 會自動去抓作業系統管理的憑證庫。
; 就算這裡有設，之後還是能在每個串流裡透過 "capath" 這個 SSL stream context 選項來覆蓋掉。
;openssl.capath=
[ffi]; 限制 FFI API 的使用權限。可以設的值有："preload"（預設值，只在 CLI 腳本跟預載檔案裡啟用）、"false"（完全停用）、"true"（完全啟用）。
;ffi.enable=preload
; 要預先載入的標頭檔清單，支援萬用字元表示法。
;ffi.preload=